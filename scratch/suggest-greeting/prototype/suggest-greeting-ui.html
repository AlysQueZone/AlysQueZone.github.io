<!--
  ПРОТОТИП (throwaway) — карта «Предложить привет», тикет scratch/suggest-greeting/issues/03-ui-prototype.md

  Вопрос: где в интерфейсе живёт вход «Предложить привет» и как выглядит форма —
  на фоне настоящей витрины, шапки, бегущей строки и инфо-плашки.

  План вариантов (переключатель снизу по центру, клавиши ← / →, вариант в hash URL):
    A «Тихая строка на витрине»      — ghost-ссылка под «Все лоты» на /lots/, модалка в одну колонку.
    B «Иконка в шапке»               — кнопка-иконка 🎬 рядом с балансом/колокольчиком (шапка общая,
                                       показываем на /lots/), модалка в два шага: сначала «что считается
                                       приветом», потом поля.
    C «Страница /suggest/»           — тихая ссылка в hero главной + секция внизу «Правил биржи»,
                                       форма живёт на отдельной странице (URL можно расшарить).
    D «Инлайн-секция внизу витрины»  — раскрывающаяся секция под «Все лоты», форма в потоке в две
                                       колонки, без модалок.
    E «Инлайн-секция: форма + инфо»  — постоянная секция под «Все лоты» (открыта по умолчанию):
                                       слева форма, справа информация. Показывается при открытии.

  Набор полей во всех вариантах одинаков: название привета, ссылка на видео, опциональный
  комментарий, пометка про вход через Twitch рядом с кнопкой; состояния: загрузка / успех /
  ошибки (чужой хост ссылки, не вошёл). Загрузки файла нет — решено владельцем, только ссылка.

  Оговорка throwaway:
    - это НЕ продакшн и НЕ часть сборки проекта; отдельный самодостаточный HTML-файл, открывается как файл;
    - отклонение от скилла `prototype` (ветка UI): варианты не вживлены маршрутом в Astro-сайт,
      потому что вопрос — про размещение входа в разных местах сайта, а не про один существующий роут;
    - никакой персистентности и сетевых запросов: форма «отправляется» в память вкладки;
    - шапка/витрина/правила — статичная копия реального каркаса; эмоуты, аватарные картинки и
      видео в карточках заменены эмодзи/заглушками (прототип не ходит в CDN); шрифты — по URL.

  Подсказки для смотрящего:
    «⚙ состояния» в нижней панели: гость / вошёл, ✔ успех, ⏳ отправка, ⚠ не вошёл,
    ⚠ ссылка (чужой хост), ⟲ сброс. Триггер сам открывает форму текущего варианта.
    «✔ успех» показывает финальное состояние «Заявка #12 улетела админу».
    Ссылку на конкретный вариант можно кинуть как #variant=E или #variant=C&who=chatter —
    состояние переживает перезагрузку и вставку хеша в тот же таб.
-->

        color: var(--color-melon);
      }

      .sg-notice.is-ok {
        border-color: var(--color-pivko);
        color: var(--color-pivko);
      }

      .sg-notice.is-info {
        border-color: var(--color-mist);
        color: var(--color-mist);
      }

      .sg-notice .sk-line {
        height: 0.6rem;
        width: 100%;
        margin-top: 0.5rem;
      }

      .sg-notice .sk-short {
        width: 40%;
      }

      .sg-success {
        display: grid;
        gap: 0.75rem;
        justify-items: start;
        border: 3px solid var(--color-pivko);
        background-color: var(--color-void);
        padding: 1rem;
      }

      .sg-success p {
        margin: 0;
        font-size: 0.875rem;
        font-weight: 700;
      }

      .sg-success .btn-arcade {
        padding: 0.6rem 1rem;
        font-size: 0.8125rem;
      }

      /* ── Страница /suggest/ (вариант C) ── */
      .suggest-hero {
        padding: 1.25rem;
      }

      .suggest-hero .badge-pixel {
        background-color: var(--color-stream);
        color: var(--color-cream);
      }

      .suggest-hero .h1 {
        margin-top: 0.75rem;
      }

      .suggest-grid {
        display: grid;
        gap: 1rem;
        margin-top: 1.5rem;
      }

      @media (min-width: 960px) {
        .suggest-grid {
          grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
          align-items: start;
        }
      }

      .form-card {
        padding: 1.25rem;
      }

      .aside-card {
        padding: 1.25rem;
      }

      .aside-card + .aside-card {
        margin-top: 1rem;
      }

      .aside-card p {
        margin: 0.5rem 0 0;
        font-size: 0.875rem;
      }

      /* ── Инлайн-секция (вариант D) ── */
      .inline-section {
        margin-top: 1.25rem;
        padding: 1.25rem;
      }

      .inline-section .inline-body {
        margin-top: 1rem;
      }

      .inline-section[hidden] {
        display: none;
      }

      /* ── Хром прототипа (намеренно чужой дизайну: тёмная пилюля) ── */
      .proto-ribbon {
        background-color: var(--color-milk);
        color: var(--color-cream);
        font-size: 0.6875rem;
        font-weight: 700;
        text-align: center;
        padding: 0.3rem 1rem;
      }

      .proto-ribbon b {
        font-family: var(--font-display);
        font-size: 9px;
        letter-spacing: 0.03em;
        color: var(--color-ember);
      }
      .proto-bar {
        position: fixed;
        left: 50%;
        bottom: calc(var(--plashka-h) + 0.5rem);
        transform: translateX(-50%);
        z-index: 120;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        width: max-content;
        max-width: calc(100vw - 1rem);
        padding: 0.5rem 0.6rem;
        background-color: var(--color-milk);
        color: var(--color-cream);
        border: 3px solid var(--color-milk);
        border-radius: 6px;
        box-shadow: 6px 6px 0 rgb(66 32 6 / 0.35);
      }

      .proto-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
      }

      .proto-row-state {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.1rem;
      }

      .proto-state {
        white-space: normal;
        text-align: left;
      }

      /* Узкий экран: панель не растёт в высоту — строки скроллятся вбок. */
      @media (max-width: 720px) {
        .proto-bar {
          width: calc(100vw - 1rem);
          max-width: none;
          padding: 0.4rem;
        }

        .proto-row-main,
        .proto-row-chips,
        .proto-row-state {
          flex-wrap: nowrap;
          justify-content: flex-start;
          overflow-x: auto;
          scrollbar-width: none;
        }

        .proto-row-main > *,
        .proto-row-chips > *,
        .proto-row-state > * {
          flex: 0 0 auto;
          white-space: nowrap;
        }

        .proto-row-main::-webkit-scrollbar,
        .proto-row-chips::-webkit-scrollbar,
        .proto-row-state::-webkit-scrollbar {
          display: none;
        }

        .proto-hint {
          display: none;
        }
      }

      .proto-badge {
        font-family: var(--font-display);
        font-size: 9px;
        line-height: 1.7;
        text-transform: uppercase;
        background-color: var(--color-melon);
        color: var(--color-cream);
        border-radius: 2px;
        padding: 3px 6px;
      }

      .proto-arrow,
      .proto-chip,
      .proto-toggle {
        font: inherit;
        font-weight: 900;
        cursor: pointer;
        border: 2px solid var(--color-cream);
        border-radius: 4px;
        background-color: transparent;
        color: var(--color-cream);
        padding: 0.25rem 0.55rem;
        font-size: 0.75rem;
        line-height: 1.4;
      }

      .proto-arrow:hover,
      .proto-chip:hover,
      .proto-toggle:hover {
        background-color: rgb(255 251 234 / 0.18);
      }

      .proto-chip[aria-pressed='true'],
      .proto-toggle[aria-pressed='true'] {
        background-color: var(--color-cream);
        color: var(--color-milk);
      }

      .proto-label {
        font-family: var(--font-display);
        font-size: 10px;
        line-height: 1.7;
        text-transform: uppercase;
        padding-inline: 0.35rem;
      }

      .proto-hint,
      .proto-state {
        font-size: 0.6875rem;
        font-weight: 700;
        color: color-mix(in srgb, var(--color-cream) 78%, transparent);
      }

      .proto-state {
        font-family: var(--font-mono, monospace);
      }

      .proto-sep {
        width: 1px;
        align-self: stretch;
        background-color: rgb(255 251 234 / 0.4);
        margin-inline: 0.15rem;
      }

      .sk-line {
        height: 0.75rem;
        width: 100%;
      }

      .sk-short {
        width: 40%;
      }
    </style>
  </head>
  <body>
    <a class="quiet-link" href="#main" style="position: absolute; left: -9999px">К содержимому</a>
    <header id="site-header" class="site-header"></header>
    <p class="proto-ribbon">
      <b>Прототип — не продакшн</b> · throwaway-артефакт, варианты листаются панелью снизу (← / →)
    </p>
    <main id="main" class="wrap page-main"><div id="page"></div></main>
    <div id="overlays"></div>
    <div id="info-plashka" class="plashka" role="note" aria-label="Инфо-плашка сайта">
      <div class="wrap plashka-inner">
        <p>🔊 Включи звук<br />🛡️ Без VPN часть штук может не грузиться</p>
        <button
          type="button"
          class="btn-arcade btn-arcade-ghost icon-btn"
          data-plashka-close
          aria-label="Закрыть подсказку"
        >
          ✕
        </button>
      </div>
    </div>
    <div id="proto-bar" class="proto-bar" role="region" aria-label="Переключатель прототипа"></div>

    <script>
      // ─────────────────────────────────────────────────────────────────────
      // Прототип: всё состояние — в памяти вкладки. Запросов нет.
      // ─────────────────────────────────────────────────────────────────────

      const VARIANTS = [
        {
          key: 'A',
          name: 'Тихая строка на витрине',
          entry: 'ghost-ссылка под «Все лоты» на /lots/',
          surface: 'модалка, одна колонка',
        },
        {
          key: 'B',
          name: 'Иконка в шапке',
          entry: 'кнопка-иконка 🎬 рядом с балансом/колокольчиком',
          surface: 'модалка в два шага',
        },
        {
          key: 'C',
          name: 'Страница /suggest/',
          entry: 'ссылка в hero главной + низ «Правил биржи»',
          surface: 'отдельная страница, URL можно расшарить',
        },
        {
          key: 'D',
          name: 'Инлайн-секция внизу витрины',
          entry: 'раскрывающаяся строка под «Все лоты»',
          surface: 'форма в потоке страницы, две колонки полей',
        },
        {
          key: 'E',
          name: 'Инлайн-секция: форма слева, инфо справа',
          entry: 'постоянная секция под «Все лоты», открыта всегда',
          surface: 'форма слева, информация справа, без модалки',
        },
      ];

      // Хосты из research/video-upload-safety.md §7 (allowlist ссылок).
      const ALLOWED_HOSTS = [
        'clips.twitch.tv',
        'twitch.tv',
        'www.twitch.tv',
        'youtube.com',
        'www.youtube.com',
        'youtu.be',
        'streamable.com',
        'www.streamable.com',
        'medal.tv',
        'www.medal.tv',
        'vk.com',
        'vkvideo.ru',
        'cdns.memealerts.com',
      ];

      const LOTS = [
        { title: 'Массовый привет (коты одобряют)', price: 800 },
        { title: 'Здраствуйте, nyanyachos', price: 1200 },
        { title: 'Миф о бесплатном пивете', price: 1000 },
        { title: 'Привет сразу всем (оптом)', price: 700 },
        { title: 'Грубый привет от Bradhi', price: 800 },
        { title: 'Привет AkseLWalkerQuE', price: 800 },
      ];

      const MY_LOTS = [
        { title: 'o7 arhion24', price: 800 },
        { title: 'Привет сразу всем (оптом)', price: 700 },
      ];

      const RULES_LINE =
        'Комиссия биржи 7% ★ перекуп +10% ×15, дальше +1 ★ гамба до x10 · 20 спинов в день ★ вход 200/200/250 ★ ';

      const ERRORS = {
        login:
          'Сначала войди через Twitch — иначе награду не начислить и авторство не получить. Поля никуда не денутся.',
        empty: 'Нужна ссылка на видео — без неё админу нечего смотреть.',
        title: 'Придумай название — по нему админ поймёт, о чём привет.',
        scheme: 'Ссылка должна начинаться с https://.',
        host: 'Ссылка не с той площадки. Принимаем Twitch clip, YouTube, streamable, medal.tv, VK и MemeAlerts.',
      };

      const ERR_LABEL = {
        login: 'не вошёл',
        empty: 'нет ссылки',
        title: 'нет названия',
        scheme: 'не https',
        host: 'чужой хост',
      };

      const state = {
        variant: 'E', // на открытии показываем победивший вариант
        who: 'guest',
        route: 'home', // только для варианта C: 'home' | 'lots' | 'suggest'
        overlay: null, // 'a' | 'b' | 'rules'
        bStep: 1,
        dOpen: false,
        demoOpen: true,
        lastEvent: 'форма не открыта',
        focus: null,
      };

      const forms = {};

      function freshForm() {
        return { title: '', url: '', comment: '', status: 'idle', error: null };
      }

      function formOf(prefix) {
        if (!forms[prefix]) forms[prefix] = freshForm();
        return forms[prefix];
      }

      function resetForms() {
        for (const key of Object.keys(forms)) delete forms[key];
      }

      function esc(value) {
        return String(value).replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]
        );
      }

      function activePrefix() {
        if (state.variant === 'A') return state.overlay === 'a' ? 'a' : null;
        if (state.variant === 'B') return state.overlay === 'b' ? 'b' : null;
        if (state.variant === 'C') return state.route === 'suggest' ? 'c' : null;
        if (state.variant === 'D') return state.dOpen ? 'd' : null;
        if (state.variant === 'E') return 'e';
        return null;
      }

      // ── Форма ────────────────────────────────────────────────────────────

      const INSTRUCTION =
        '<p class="sg-instruction">Предлагаемое видео должно быть по смыслу похоже на уже существующие приветы — ' +
        'то, что не стыдно показать всему чату. Пример: «Массовый привет (коты одобряют)».</p>';

      // Вариант E: инструкция — обычный текст в правой колонке, без callout и без примера.
      const INSTRUCTION_PLAIN =
        '<p class="sg-info-lead">Предлагаемое видео должно быть по смыслу похоже на уже существующие приветы — ' +
        'то, что не стыдно показать всему чату.</p>';

      function noticeHTML(f) {
        if (f.status === 'loading') {
          return (
            '<div class="sg-notice is-info" role="status" tabindex="-1" data-notice>' +
            '<p><b>Отправляем заявку…</b></p>' +
            '<span class="skeleton-block sk-line"></span>' +
            '<span class="skeleton-block sk-line sk-short"></span>' +
            '</div>'
          );
        }
        if (f.error) {
          return `<div class="sg-notice is-err" role="alert" tabindex="-1" data-notice><p>⚠ ${esc(
            ERRORS[f.error] ?? 'Что-то пошло не так.'
          )}</p></div>`;
        }
        return '<div class="sg-notice" data-notice hidden></div>';
      }

      function submitDisabled(f) {
        return f.status === 'loading' || f.status === 'success';
      }

      function actionsHTML(prefix) {
        const f = formOf(prefix);
        if (state.who !== 'chatter') {
          return (
            '<div class="sg-actions">' +
            '<button type="button" class="btn-arcade btn-twitch" data-login>▶ Войти через Twitch</button>' +
            '<p class="sg-hint">🔒 Войти через Twitch нужно, чтобы начислить награду и получить авторство</p>' +
            '</div>'
          );
        }
        const loading = f.status === 'loading';
        return (
          '<div class="sg-actions">' +
          `<button type="submit" class="btn-arcade btn-arcade-primary" data-submit ${
            submitDisabled(f) ? 'disabled' : ''
          }>${loading ? '⏳ Отправляем…' : 'Отправить заявку'}</button>` +
          '</div>'
        );
      }

      function urlFieldHTML(f) {
        const badUrl = f.error === 'scheme' || f.error === 'host' ? ' is-bad' : '';
        const dis = f.status === 'loading' ? ' disabled' : '';
        return (
          '<label class="sg-field"><span class="sg-label">Ссылка на видео</span>' +
          `<input class="sg-input${badUrl}" data-f="url" type="text" inputmode="url" autocomplete="off"${dis} ` +
          `placeholder="https://clips.twitch.tv/..." value="${esc(f.url)}">` +
          '<span class="sg-hint">Twitch clip / YouTube / MemeAlerts и т.д.</span></label>'
        );
      }

      function successHTML(prefix) {
        return (
          '<div class="sg-success" role="status" tabindex="-1" data-success>' +
          '<p class="display h3">Заявка #12 улетела админу</p>' +
          '<p>Админ посмотрит видео и решит. Придёт принятие — награда капнет в Пивкойны. ' +
          'Статус заявок на сайте пока не показываем — это отдельный разговор.</p>' +
          `<button type="button" class="btn-arcade btn-arcade-ghost" data-reset-form="${prefix}">Отправить ещё одну</button>` +
          '</div>'
        );
      }

      function formHTML(prefix, layout) {
        const f = formOf(prefix);
        if (f.status === 'success') return successHTML(prefix);
        const dis = f.status === 'loading' ? ' disabled' : '';
        const title =
          '<label class="sg-field"><span class="sg-label">Название привета</span>' +
          `<input class="sg-input" data-f="title" type="text" maxlength="80" autocomplete="off"${dis} ` +
          `placeholder="Массовый привет" value="${esc(f.title)}"></label>`;
        const comment =
          '<label class="sg-field"><span class="sg-label">Комментарий <span class="muted">(не обязательно)</span></span>' +
          `<textarea class="sg-input sg-textarea" data-f="comment" rows="2" placeholder="В этом VOD на 15:01 отличный привет"${dis}>${esc(
            f.comment
          )}</textarea></label>`;
        const url = urlFieldHTML(f);

        if (layout === 'inline') {
          // Вариант D: две колонки — поля слева, ссылка справа.
          return (
            `<form class="sg-form sg-form--wide" data-form="${prefix}" novalidate onsubmit="return false">` +
            `<div class="sg-col">${INSTRUCTION}${noticeHTML(f)}${title}${comment}${actionsHTML(
              prefix
            )}</div>` +
            `<div class="sg-col">${url}</div>` +
            '</form>'
          );
        }
        // stack (A/B/C) и split (E): одна колонка полей; в split инструкция живёт в правой колонке.
        return (
          `<form class="sg-form" data-form="${prefix}" novalidate onsubmit="return false">` +
          (layout === 'split' ? '' : INSTRUCTION) +
          noticeHTML(f) +
          title +
          url +
          comment +
          actionsHTML(prefix) +
          '</form>'
        );
      }

      function paintForm(prefix) {
        const form = document.querySelector(`form[data-form="${prefix}"]`);
        if (!form) return;
        const f = formOf(prefix);
        const notice = form.querySelector('[data-notice]');
        if (notice && !f.error) {
          if (notice.classList.contains('is-err')) notice.outerHTML = noticeHTML(f);
        } else if (f.error && notice) {
          notice.outerHTML = noticeHTML(f);
        }
        const url = form.querySelector('[data-f="url"]');
        if (url) {
          url.classList.toggle('is-bad', f.error === 'scheme' || f.error === 'host');
        }
      }

      function validate(f) {
        const url = f.url.trim();
        if (!url) return 'empty';
        if (!f.title.trim()) return 'title';
        if (!/^https:\/\//i.test(url)) return 'scheme';
        let host = '';
        try {
          host = new URL(url).host.toLowerCase();
        } catch {
          return 'scheme';
        }
        if (!ALLOWED_HOSTS.includes(host)) return 'host';
        return null;
      }

      let loadingTimer = 0;

      function submitForm(prefix) {
        const f = formOf(prefix);
        if (f.status === 'loading' || f.status === 'success') return;
        if (state.who !== 'chatter') {
          f.error = 'login';
          state.lastEvent = 'ошибка: не вошёл';
          state.focus = 'notice';
          render();
          return;
        }
        const error = validate(f);
        if (error) {
          f.error = error;
          state.lastEvent = `ошибка: ${ERR_LABEL[error]}`;
          state.focus = 'notice';
          render();
          return;
        }
        f.error = null;
        f.status = 'loading';
        state.lastEvent = 'загрузка: отправляем';
        render();
        window.clearTimeout(loadingTimer);
        loadingTimer = window.setTimeout(() => {
          f.status = 'success';
          state.lastEvent = 'успех: заявка #12';
          render();
        }, 1200);
      }

      // ── Шапка ────────────────────────────────────────────────────────────

      function marqueeHTML() {
        const half = `<span>${RULES_LINE.repeat(4)}</span>`;
        return (
          '<div class="marquee marquee-strip" aria-hidden="true">' +
          `<p class="marquee-track display">${half}${half}</p>` +
          '</div>'
        );
      }

      function headerHTML() {
        const chatter = state.who === 'chatter';
        const bEntry =
          state.variant === 'B'
            ? '<button type="button" class="btn-arcade btn-arcade-ghost icon-btn" data-open-form="b" ' +
              'title="Предложить привет" aria-label="Предложить привет">🎬</button>'
            : '';
        const wallet = chatter
          ? '<div class="chip-arcade wallet">🍺 <span>1 240</span> <span class="muted">Пивкойнов</span></div>'
          : '';
        const bell = chatter
          ? '<button type="button" class="btn-arcade btn-arcade-ghost icon-btn" title="Перекупы твоих лотов" aria-label="Перекупы твоих лотов">🔔</button>'
          : '';
        const auth = chatter
          ? '<span class="chip-arcade wallet">@nyanyachos</span>' +
            '<button type="button" class="btn-arcade btn-arcade-ghost" data-logout>Выйти</button>'
          : '<button type="button" class="btn-arcade btn-twitch" data-login>▶ Войти через Twitch</button>';
        return (
          '<div class="wrap header-row">' +
          '<button type="button" class="logo" data-route="home" aria-label="AlysQueZone — на главную">' +
          '<span class="display">Alys<span class="text-stream">Que</span>Zone<span class="text-blush">.</span></span>' +
          '</button>' +
          '<div class="header-actions">' +
          '<button type="button" class="btn-arcade btn-arcade-ghost animate-blink">🍺 гамба на пивкойны</button>' +
          wallet +
          bEntry +
          bell +
          '<span style="display:flex;flex-wrap:wrap;align-items:center;gap:.5rem">' +
          auth +
          '</span>' +
          '</div>' +
          '</div>' +
          marqueeHTML()
        );
      }

      // ── Витрина / главная / /suggest/ ─────────────────────────────────────

      function lotCard(lot) {
        return (
          '<article class="card-pixel lot-card">' +
          `<h3 class="lot-title"><button type="button" class="lot-link" data-noop>${esc(
            lot.title
          )}</button></h3>` +
          '<div class="lot-video">▶ видео лота</div>' +
          '<p class="muted" style="margin:0;font-size:.875rem">владелец: —</p>' +
          `<p class="price">${lot.price} 🍺</p>` +
          '<button type="button" class="btn-arcade btn-arcade-primary" data-noop>▶ Купить</button>' +
          '</article>'
        );
      }

      function myGreetingsHTML() {
        if (state.who !== 'chatter') {
          return '<div class="my-rows"><p class="muted" style="margin:0;font-size:.875rem;font-weight:700">Войди через Twitch — тут будут твои приветы</p></div>';
        }
        return (
          '<div class="my-rows">' +
          MY_LOTS.map(
            (lot) =>
              `<div class="my-row"><button type="button" class="lot-link" data-noop>${esc(
                lot.title
              )}</button><span class="text-pivko"> ${lot.price} 🍺</span></div>`
          ).join('') +
          '</div>'
        );
      }

      // ── Оверлеи ──────────────────────────────────────────────────────────

      function overlayA() {

      function rulesModal() {

          '<p class="muted">Знаешь привет, которого нет на бирже? Пришли видео — админ посмотрит. За принятую заявку капнет награда в Пивкойнах.</p>' +

      function overlaysHTML() {
        let html = '';
        if (state.variant === 'A' && state.overlay === 'a') html += overlayA();
        if (state.variant === 'B' && state.overlay === 'b') html += overlayB();
        if (state.variant === 'C' && state.overlay === 'rules') html += rulesModal();
        return html;
      }

      // ── Нижняя панель прототипа ──────────────────────────────────────────

      function stateLine() {
        const parts = [
          `вариант ${state.variant}`,
          state.who === 'chatter' ? 'вошёл @nyanyachos' : 'гость',
        ];
        const prefix = activePrefix();
        if (!prefix) {
          parts.push('форма закрыта');
          return parts.join(' · ');
        }
        const f = formOf(prefix);
        const where = {
          a: 'модалка на витрине',
          b: 'модалка в два шага',
          c: 'страница /suggest/',
          d: 'инлайн-секция, две колонки полей',
          e: 'инлайн-секция, форма + инфо',
        }[prefix];
        parts.push(`форма: ${where}`);
        if (prefix === 'b' && state.bStep === 1) {
          parts.push('шаг 1: что считается приветом');
          return parts.join(' · ');
        }
        parts.push(
          f.status === 'success'
            ? 'заявка #12 отправлена'
            : f.status === 'loading'
              ? 'отправка…'
              : f.error
                ? `ошибка: ${ERR_LABEL[f.error]}`
                : 'заполняется'
        );
        return parts.join(' · ');
      }

      function protoBarHTML() {
        const v = VARIANTS.find((item) => item.key === state.variant) ?? VARIANTS[0];
        const chip = (trigger, label, title) =>
          `<button type="button" class="proto-chip" data-trigger="${trigger}" title="${title}">${label}</button>`;
        return (
          '<div class="proto-row proto-row-main">' +
          '<span class="proto-badge">Прототип — не продакшн</span>' +
          '<button type="button" class="proto-arrow" data-nav="-1" aria-label="Предыдущий вариант">←</button>' +
          `<span class="proto-label">${v.key} (${v.name})</span>` +
          '<button type="button" class="proto-arrow" data-nav="1" aria-label="Следующий вариант">→</button>' +
          `<button type="button" class="proto-toggle" data-demo-toggle aria-pressed="${state.demoOpen}" title="Показать/скрыть состояния">⚙ состояния</button>` +
          '<span class="proto-hint">клавиши ← / → листают</span>' +
          '</div>' +
          (state.demoOpen
            ? '<div class="proto-row proto-row-chips">' +
              '<span class="proto-hint">кто:</span>' +
              `<button type="button" class="proto-chip" data-who="guest" aria-pressed="${state.who === 'guest'}">гость</button>` +
              `<button type="button" class="proto-chip" data-who="chatter" aria-pressed="${state.who === 'chatter'}">@nyanyachos</button>` +
              '<span class="proto-sep"></span>' +
              chip('success', '✔ успех', 'Показать успех: «Заявка #12 улетела админу»') +
              chip('loading', '⏳ отправка', 'Показать загрузку: кнопка disabled') +
              chip('nologin', '⚠ не вошёл', 'Показать ошибку «не вошёл»') +
              chip('badlink', '⚠ ссылка', 'Подставить чужой хост и показать ошибку') +
              chip('reset', '⟲ сброс', 'Очистить форму') +
              '</div>'
            : '') +
          '<div class="proto-row proto-row-state">' +
          `<span class="proto-state" data-proto-state>состояние: ${esc(stateLine())}</span>` +
          `<span class="proto-state" data-proto-event>последнее: ${esc(state.lastEvent)}</span>` +
          '</div>'
        );
      }

      function renderBar() {
        document.getElementById('proto-bar').innerHTML = protoBarHTML();
      }

      // ── Рендер и действия ────────────────────────────────────────────────

      function render() {
        document.getElementById('site-header').innerHTML = headerHTML();
        document.getElementById('page').innerHTML = pageHTML();
        document.getElementById('overlays').innerHTML = overlaysHTML();
        renderBar();
        syncUrl();
        if (state.focus) {
          const sel = state.focus === 'success' ? '[data-success]' : '[data-notice]';
          const el = document.querySelector(sel);
          if (el) el.focus();
          state.focus = null;
        }
      }

      function syncUrl() {
        const params = new URLSearchParams();
        params.set('variant', state.variant);
        params.set('who', state.who);
        const hash = `#${params.toString()}`;
        try {
          history.replaceState(null, '', hash);
        } catch {
          location.hash = hash.slice(1);
        }
      }

      function readUrl() {
        const raw = (location.hash.slice(1) || location.search.slice(1)).trim();
        if (!raw) return;
        const params = new URLSearchParams(raw);
        const variant = (params.get('variant') ?? '').toUpperCase();
        if (VARIANTS.some((v) => v.key === variant)) state.variant = variant;
        const who = params.get('who');
        if (who === 'guest' || who === 'chatter') state.who = who;
      }

      /** Ссылку с чужим #variant=… можно вставить в тот же таб: перечитываем hash без перезагрузки. */
      window.addEventListener('hashchange', () => {
        const before = `${state.variant}:${state.who}`;
        readUrl();
        if (`${state.variant}:${state.who}` === before) return;
        state.overlay = null;
        state.route = 'home';
        state.dOpen = false;
        state.bStep = 1;
        state.lastEvent = 'вариант из URL';
        resetForms();
        render();
      });

      function setVariant(key) {
        state.variant = key;
        state.overlay = null;
        state.route = 'home';
        state.dOpen = false;
        state.bStep = 1;
        state.lastEvent = 'форма не закрыта — вход не тронут';
        state.focus = null;
        resetForms();
        render();
      }

      function setWho(who) {
        state.who = who;
        state.lastEvent = who === 'chatter' ? 'вход: @nyanyachos' : 'режим гостя';
        for (const f of Object.values(forms)) {
          if (f.error === 'login') f.error = null;
        }
        render();
      }

      function ensureOpen() {
        if (state.variant === 'A') state.overlay = 'a';
        else if (state.variant === 'B') {
          state.overlay = 'b';
          state.bStep = 2; // панель состояний открывает сразу форму, а не шаг «что считается приветом»
        } else if (state.variant === 'C') state.route = 'suggest';
        else if (state.variant === 'D') state.dOpen = true;
      }

      function openForm(prefix) {
        state.overlay = null;
        if (prefix === 'a') state.overlay = 'a';
        if (prefix === 'b') {
          state.overlay = 'b';
          state.bStep = 1;
        }
        if (prefix === 'c') {
          state.route = 'suggest';
        }
        if (prefix === 'd') {
          state.dOpen = true;
        }
        forms[prefix] = freshForm();
        state.lastEvent = 'форма открыта — ждём заполнения';
        render();
      }

      const TRIGGERS = {
        success() {
          state.who = 'chatter';
          const f = formOf(activePrefix());
          f.error = null;
          f.status = 'success';
          state.lastEvent = 'успех: заявка #12 улетела админу';
        },
        loading() {
          state.who = 'chatter';
          const f = formOf(activePrefix());
          f.error = null;
          f.status = 'loading';
          state.lastEvent = 'загрузка: кнопка disabled';
        },
        nologin() {
          state.who = 'guest';
          const f = formOf(activePrefix());
          f.status = 'idle';
          f.error = 'login';
          state.lastEvent = 'ошибка: не вошёл';
        },
        badlink() {
          const f = formOf(activePrefix());
          f.status = 'idle';
          f.url = 'https://example.com/privet.mp4';
          f.error = 'host';
          state.lastEvent = 'ошибка: чужой хост ссылки';
        },
        reset() {
          const prefix = activePrefix();
          if (prefix) forms[prefix] = freshForm();
          state.lastEvent = 'форма сброшена';
        },
      };

      // ── События ──────────────────────────────────────────────────────────

      document.addEventListener('click', (event) => {
        const target = event.target;
        if (!(target instanceof Element)) return;
        const hit = (sel) => target.closest(sel);

        if (hit('[data-noop]')) {
          event.preventDefault();
          return;
        }

        const nav = hit('[data-nav]');
        if (nav) {
          const dir = Number(nav.dataset.nav) || 1;
          const index = VARIANTS.findIndex((v) => v.key === state.variant);
          const next = VARIANTS[(index + dir + VARIANTS.length) % VARIANTS.length];
          setVariant(next.key);
          return;
        }

        const toggle = hit('[data-demo-toggle]');
        if (toggle) {
          state.demoOpen = !state.demoOpen;
          renderBar();
          return;
        }

        const who = hit('[data-who]');
        if (who) {
          setWho(who.dataset.who);
          return;
        }

        const trigger = hit('[data-trigger]');
        if (trigger) {
          const name = trigger.dataset.trigger;
          ensureOpen();
          TRIGGERS[name]?.();
          render();
          return;
        }

        const open = hit('[data-open-form]');
        if (open) {
          event.preventDefault();
          openForm(open.dataset.openForm);
          return;
        }

        const closeOverlay = hit('[data-close-overlay]');
        if (closeOverlay) {
          state.overlay = null;
          state.lastEvent = 'окно закрыто';
          render();
          return;
        }

        const overlay = hit('[data-overlay]');
        if (overlay && event.target === overlay) {
          state.overlay = null;
          render();
          return;
        }

        const bStep = hit('[data-b-step]');
        if (bStep) {
          state.bStep = Number(bStep.dataset.bStep) === 2 ? 2 : 1;
          render();
          return;
        }

        const inline = hit('[data-toggle-inline]');
        if (inline) {
          state.dOpen = !state.dOpen;
          state.lastEvent = state.dOpen ? 'форма раскрыта' : 'форма свёрнута';
          render();
          return;
        }

        const reset = hit('[data-reset-form]');
        if (reset) {
          forms[reset.dataset.resetForm] = freshForm();
          state.lastEvent = 'форма готова к новой заявке';
          render();
          return;
        }

        const login = hit('[data-login]');
        if (login) {
          event.preventDefault();
          setWho('chatter');
          return;
        }

        const logout = hit('[data-logout]');
        if (logout) {
          setWho('guest');
          return;
        }

        const rules = hit('[data-rules-open]');
        if (rules) {
          state.overlay = 'rules';
          render();
          return;
        }

        const route = hit('[data-route]');
        if (route) {
          const next = route.dataset.route;
          state.route = next;
          state.overlay = null;
          state.lastEvent = `страница: ${next === 'suggest' ? '/suggest/' : next === 'lots' ? '/lots/' : '/'}`;
          render();
          return;
        }

        const plashka = hit('[data-plashka-close]');
        if (plashka) {
          document.getElementById('info-plashka').hidden = true;
          document.body.classList.add('plashka-off');
        }
      });

      document.addEventListener('submit', (event) => {
        event.preventDefault();
        const form =
          event.target instanceof Element ? event.target.closest('form[data-form]') : null;
        if (form) submitForm(form.dataset.form);
      });

      document.addEventListener('input', (event) => {
        const el = event.target;
        if (!(el instanceof Element)) return;
        const field = el.closest('[data-f]');
        if (!field) return;
        const form = field.closest('form[data-form]');
        if (!form) return;
        const key = field.dataset.f;
        if (key !== 'title' && key !== 'url' && key !== 'comment') return;
        const f = formOf(form.dataset.form);
        f[key] = field.value;
        if (f.error) {
          f.error = null;
          state.lastEvent = 'ошибка снята — правь дальше';
          paintForm(form.dataset.form);
          const bar = document.querySelector('[data-proto-state]');
          if (bar) bar.textContent = stateLine();
          const ev = document.querySelector('[data-proto-event]');
          if (ev) ev.textContent = `последнее: ${state.lastEvent}`;
        }
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && state.overlay) {
          state.overlay = null;
          render();
          return;
        }
        if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
        const target = event.target;
        if (
          target instanceof Element &&
          target.closest('input, textarea, select, [contenteditable]')
        ) {
          return;
        }
        if (state.overlay) return;
        event.preventDefault();
        const dir = event.key === 'ArrowRight' ? 1 : -1;
        const index = VARIANTS.findIndex((v) => v.key === state.variant);
        const next = VARIANTS[(index + dir + VARIANTS.length) % VARIANTS.length];
        setVariant(next.key);
      });

      readUrl();
      render();
    </script>
  </body>
</html>
