<!doctype html>
<!--
  ПРОТОТИП (throwaway) — правила ленты витрины `/lots/`.

  Вопрос: как раскладывать карточки, если видео разной пропорции?
    1. Портрет (≈9:16, большинство) — как сейчас, ячейка в сетке.
    2. Широкое (16:9) — занимает целую строку одной большой карточкой,
       а не мелкую ячейку 1/3.
    3. Квадрат — ? (тумблер: обычная ячейка / две колонки).

  Варианты (переключатель внизу, ?variant=):
    0 «Как сейчас»          — правила нет: все карточки в ячейках 1/3, широкое
                              вписывается в свою ячейку (мелко).
    A «Полоса: медиа слева» — широкое = полоса во всю строку: медиа слева,
                              инфо (владелец/название/кнопка) справа.
    B «Полоса: медиа сверху»— широкое = полоса: широкий кадр-баннер сверху,
                              инфо-строка под ним.
    C «Полоса: инфо поверх» — широкое = полоса: кадр во всю ширину целиком,
                              инфо-плашка (владелец/название/кнопка) поверх низа.
    D «Полоса: медиа шире»  — как A, но медиа ~72%, инфо-колонка узкая и по
                              центру (лечит «пустое поле справа» у A).

  Тумблеры сверху:
    - «Квадрат»: как портрет (обрезка в 77:136) / размытая подложка (кадр
      вписан целиком, поля — его размытая копия) / квадрат 1:1 / две колонки.
    - «Дыры»:   как есть / плотно (dense) — широкая карточка оставляет пустые
                ячейки в конце предыдущего ряда; dense подтягивает туда
                следующие мелкие карточки (ценой порядка по цене).

  По умолчанию открывается вариант B, квадрат — «размытая подложка».

  Оговорка throwaway (как в scratch/lot-cards):
    - НЕ часть сборки, отдельный HTML вне Astro;
    - токены/шрифты/классы повторены вручную; данные — реальные (title,
      постер, цена из content/lots.toml), владельцы — фейковые;
    - кнопки декоративные, ничего не покупают; постеры — хотлинком.
-->

      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;700;800;900&display=swap"
      rel="stylesheet"

    <style>
      :root {
        color-scheme: light;
        --color-void: #fff6bf;
        --color-panel: #ffe6ac;
        --color-bar: #ffe4a6;
        --color-card: #f0c46c;
        --color-milk: #422006;
        --color-mist: #744210;
        --color-stream: #c2187b;
        --color-ctahover: #9e145f;
        --color-ember: #ff9e2c;
        --color-legend: #b3127a;
        --color-cream: #fffbea;
        --color-pivko: #7a5f00;
        --font-display: 'Press Start 2P', 'Rubik', system-ui, sans-serif;
        --font-sans: 'Rubik', system-ui, -apple-system, sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background-color: var(--color-void);
        color: var(--color-milk);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        padding-bottom: 7rem;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      :focus-visible {
        outline: 3px solid #ff00bc;
        outline-offset: 2px;
      }

      .wrap {
        max-width: 72rem;
        margin: 0 auto;
        padding: 1rem 1rem 2rem;
      }

      .topbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        border-bottom: 3px solid var(--color-milk);
        padding-bottom: 0.75rem;
        margin-bottom: 0.75rem;
      }

      .brand {
        font-family: var(--font-display);
        font-size: 14px;
        line-height: 1.7;
        text-transform: uppercase;
      }

      .tag {
        font-family: var(--font-display);
        font-size: 9px;
        line-height: 1.7;
        text-transform: uppercase;
        background: var(--color-legend);
        color: var(--color-cream);
        padding: 4px 8px;
        border-radius: 2px;
        margin-left: 0.5rem;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
      }

      .control {
        display: flex;
        align-items: center;
        gap: 0.35rem;
      }

      .control > .label {
        font-weight: 900;
        font-size: 0.75rem;
        text-transform: uppercase;
      }

      .seg {
        display: inline-flex;
      }

      .seg button {
        font: inherit;
        font-weight: 900;
        font-size: 0.75rem;
        border: 3px solid var(--color-milk);
        background: var(--color-panel);
        color: var(--color-milk);
        padding: 0.4rem 0.6rem;
        min-height: 40px;
        cursor: pointer;
      }

      .seg button + button {
        border-left: 0;
      }

      .seg button:first-child {
        border-radius: 4px 0 0 4px;
      }

      .seg button:last-child {
        border-radius: 0 4px 4px 0;
      }

      .seg button[aria-pressed='true'] {
        background: var(--color-stream);
        color: var(--color-cream);
      }

      .hint {
        font-size: 0.85rem;
        color: var(--color-mist);
        margin: 0 0 1rem;
      }

      /* ---- лента ---------------------------------------------------------- */
      .feed {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1rem;
        align-items: start;
      }

      .feed.dense {
        grid-auto-flow: dense;
      }

      @media (max-width: 900px) {
        .feed {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 620px) {
        .feed {
          grid-template-columns: 1fr;
        }
      }

      /* Ячейка сетки: одинаковая высота ряда, кнопка прижата к низу. */
      .card {
        background: var(--color-panel);
        border: 3px solid var(--color-milk);
        box-shadow: 6px 6px 0 var(--color-milk);
        border-radius: 4px;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        min-width: 0;
      }

      .title {
        font-size: 1rem;
        font-weight: 900;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .media {
        position: relative;
        width: 100%;
        overflow: hidden;
        border: 2px solid var(--color-milk);
        background: #000;
      }

      .media img {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* Квадрат на размытой подложке: сам кадр вписан целиком, поля заполняет
         его же увеличенная размытая копия — рамка остаётся «телефонной». */
      .sq-bg {
        position: absolute;
        inset: 0;
        z-index: 0;
        background-size: cover;
        background-position: center;
        filter: blur(14px) brightness(0.55);
        transform: scale(1.12);
      }

      .media img.sq-fg {
        position: relative;
        z-index: 1;
      }

      .play {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgb(0 0 0 / 35%);
        border: 0;
        cursor: pointer;
        padding: 0;
      }

      .badge {
        position: absolute;
        top: 0.5rem;
        left: 0.5rem;
        pointer-events: none;
        display: inline-block;
        font-family: var(--font-display);
        font-size: 9px;
        line-height: 1.7;
        padding: 4px 8px;
        border-radius: 2px;
        text-transform: uppercase;
        max-width: 85%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .badge-owner {
        background: var(--color-milk);
        color: var(--color-cream);
      }

      .badge-free {
        background: var(--color-bar);
        color: var(--color-mist);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.25rem;
        min-height: 44px;
        width: 100%;
        border: 3px solid var(--color-milk);
        box-shadow: 4px 4px 0 var(--color-milk);
        border-radius: 4px;
        font: inherit;
        font-weight: 900;
        font-size: 0.85rem;
        text-transform: uppercase;
        cursor: pointer;
        padding: 0.5rem 1rem;
        background: var(--color-stream);
        color: var(--color-cream);
        text-align: center;
      }

      .btn-s {
        min-height: 0;
        font-size: 0.7rem;
        padding: 0.5rem 0.75rem;
      }

      .cta {
        margin-top: auto;
        padding-top: 0.5rem;
      }

      /* квадрат в две колонки (тумблер) */
      .card.span2 {
        grid-column: span 2;
      }

      @media (max-width: 900px) {
        .card.span2 {
          grid-column: auto;
        }
      }

      /* ---- широкая полоса ------------------------------------------------- */
      .card.wide {
        grid-column: 1 / -1;
      }

      /* A: медиа слева, инфо справа */
      .card.wide-a {
        flex-direction: row;
        gap: 1rem;
        align-items: stretch;
      }

      .wa-media {
        position: relative;
        flex: 0 0 58%;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border: 2px solid var(--color-milk);
        background: #000;
      }

      .wa-media img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .wa-info {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .ratio-note {
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--color-mist);
      }

      /* D: медиа широкое, инфо-колонка узкая и по центру (меньше «пустоты»). */
      .card.wide-d {
        flex-direction: row;
        gap: 1rem;
        align-items: stretch;
      }

      .wd-media {
        position: relative;
        flex: 0 0 72%;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border: 2px solid var(--color-milk);
        background: #000;
      }

      .wd-media img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .wd-info {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 0.5rem;
      }

      .wd-info .cta {
        margin-top: 0.25rem;
      }

      /* C: кадр во всю ширину целиком, инфо-плашка поверх низа кадра. */
      .card.wide-c {
        padding: 0;
        overflow: hidden;
      }

      .wc-cover {
        position: relative;
        width: 100%;
        overflow: hidden;
        background: #000;
      }

      .wc-cover img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .wc-overlay {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
        padding: 0.9rem 1rem;
        background: linear-gradient(to top, rgb(0 0 0 / 80%), rgb(0 0 0 / 0%));
      }

      .wc-overlay .badge {
        position: static;
      }

      .wc-overlay .title {
        flex: 1;
        min-width: 12rem;
        color: var(--color-cream);
      }

      .wc-overlay .cta {
        margin: 0;
        padding: 0;
        flex: 0 0 auto;
      }

      .wc-overlay .btn {
        width: auto;
      }

      /* B: широкий кадр-баннер сверху, инфо-строка снизу */
      .card.wide-b {
        padding: 0;
        overflow: hidden;
      }

      .wb-cover {
        position: relative;
        width: 100%;
        height: min(38vh, 340px);
        overflow: hidden;
        background: #000;
        border-bottom: 3px solid var(--color-milk);
      }

      .wb-cover img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .wb-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
        padding: 1rem;
      }

      .wb-bar .title {
        flex: 1;
        min-width: 12rem;
      }

      .wb-bar .cta {
        margin: 0;
        padding: 0;
        flex: 0 0 auto;
      }

      .wb-bar .btn {
        width: auto;
      }

      @media (max-width: 760px) {
        .card.wide-a,
        .card.wide-d {
          flex-direction: column;
        }

        .wa-media,
        .wd-media {
          flex: 0 0 auto;
          aspect-ratio: 16 / 9;
        }

        .wc-overlay .btn,
        .wc-overlay .cta {
          width: 100%;
        }
      }

      /* ---- переключатель вариантов ---------------------------------------- */
      .switcher {
        position: fixed;
        left: 50%;
        bottom: 1rem;
        transform: translateX(-50%);
        z-index: 60;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: var(--color-milk);
        color: var(--color-cream);
        border-radius: 999px;
        padding: 0.4rem 0.5rem;
        box-shadow: 0 6px 0 rgb(0 0 0 / 25%);
        max-width: calc(100vw - 1rem);
      }

      .switcher button {
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 999px;
        border: 0;
        background: var(--color-cream);
        color: var(--color-milk);
        font-size: 1.1rem;
        font-weight: 900;
        cursor: pointer;
        flex: 0 0 auto;
      }

      .switcher .slabel {
        font-family: var(--font-display);
        font-size: 9px;
        line-height: 1.7;
        text-align: center;
        min-width: 15rem;
        text-transform: uppercase;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      @media (max-width: 520px) {
        .switcher .slabel {
          min-width: 0;
        }
      }
    </style>
  </head>

      ];

      const STATE = { square: 'blur', dense: 'off' };
      const esc = (s) =>
        String(s).replace(
          /[&<>"]/g,
          (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]
        );
      const next = (p) => Math.ceil(p * 1.1);

      function kindOf(l) {
        const r = l.w / l.h;
        if (r >= 1.2) return 'wide';
        if (r >= 0.9) return 'square';
        return 'portrait';
      }

      function ownerBadge(l) {
        return l.owner
          ? `<span class="badge badge-owner">👑 ${esc(l.owner)}</span>`
          : `<span class="badge badge-free">свободен</span>`;
      }

      function playBtn() {
        return `<button class="play" type="button" aria-label="Смотреть привет"><span class="btn btn-s">▶ смотреть</span></button>`;
      }

      function cta(l) {
        return `<div class="cta"><button class="btn" type="button">▶ Забрать за ${next(l.price)} 🍺</button></div>`;
      }

      // Ячейка с заданной пропорцией кадра и способом заполнения.
      function cellCardWith(l, aspect, fit, extraClass) {
        return `<article class="card${extraClass || ''}">
          <h3 class="title">${esc(l.title)}</h3>
          <div class="media" style="aspect-ratio:${aspect}">
            <img src="${l.poster}" alt="" loading="lazy" style="object-fit:${fit}" />
            ${playBtn()}
            ${ownerBadge(l)}
          </div>
          ${cta(l)}
        </article>`;
      }

      // Квадрат — режим из тумблера: как портрет (обрезка) / размытая подложка /
      // квадрат 1:1 / две колонки.
      function squareCard(l) {
        if (STATE.square === 'crop') return cellCardWith(l, '77 / 136', 'cover');
        if (STATE.square === 'blur') {
          return `<article class="card">
            <h3 class="title">${esc(l.title)}</h3>
            <div class="media" style="aspect-ratio:77 / 136">
              <div class="sq-bg" style="background-image:url('${l.poster}')"></div>
              <img class="sq-fg" src="${l.poster}" alt="" loading="lazy" style="object-fit:contain" />
              ${playBtn()}
              ${ownerBadge(l)}
            </div>
            ${cta(l)}
          </article>`;
        }
        return cellCardWith(l, '1 / 1', 'contain', STATE.square === 'span2' ? ' span2' : '');
      }

      // Обычная ячейка: портрет 77:136 + заполнение; квадрат — по режиму;
      // широкое (вариант 0) — своя пропорция, вписывание.
      function cellCard(l) {
        const k = kindOf(l);
        if (k === 'square') return squareCard(l);
        if (k === 'portrait') return cellCardWith(l, '77 / 136', 'cover');
        return cellCardWith(l, `${l.w} / ${l.h}`, 'contain');
      }

      // Полоса A: медиа слева, инфо справа.
      function wideA(l) {
        return `<article class="card wide wide-a">
          <div class="wa-media">
            <img src="${l.poster}" alt="" loading="lazy" />
            ${playBtn()}
            ${ownerBadge(l)}
          </div>
          <div class="wa-info">
            <h3 class="title">${esc(l.title)}</h3>
            <p class="ratio-note">широкое ${l.w}×${l.h} · вся строка</p>
            <div class="cta"><button class="btn" type="button">▶ Забрать за ${next(l.price)} 🍺</button></div>
          </div>
        </article>`;
      }

      // Полоса B: широкий кадр-баннер сверху, инфо-строка снизу.
      function wideB(l) {
        return `<article class="card wide wide-b">
          <div class="wb-cover">
            <img src="${l.poster}" alt="" loading="lazy" />
            ${playBtn()}
            ${ownerBadge(l)}
          </div>
          <div class="wb-bar">
            <h3 class="title">${esc(l.title)}</h3>
            <div class="cta"><button class="btn" type="button">▶ Забрать за ${next(l.price)} 🍺</button></div>
          </div>
        </article>`;
      }

      // Полоса C: кадр во всю ширину целиком (пропорция видео), инфо-плашка
      // поверх низа кадра — отдельного поля справа нет.
      function wideC(l) {
        return `<article class="card wide wide-c">
          <div class="wc-cover" style="aspect-ratio:${l.w} / ${l.h}">
            <img src="${l.poster}" alt="" loading="lazy" />
            ${playBtn()}
            <div class="wc-overlay">
              ${ownerBadge(l)}
              <h3 class="title">${esc(l.title)}</h3>
              <div class="cta"><button class="btn" type="button">▶ Забрать за ${next(l.price)} 🍺</button></div>
            </div>
          </div>
        </article>`;
      }

      // Полоса D: как A, но медиа шире (~72%), инфо-колонка узкая и по центру.
      function wideD(l) {
        return `<article class="card wide wide-d">
          <div class="wd-media">
            <img src="${l.poster}" alt="" loading="lazy" />
            ${playBtn()}
            ${ownerBadge(l)}
          </div>
          <div class="wd-info">
            <h3 class="title">${esc(l.title)}</h3>
            <div class="cta"><button class="btn" type="button">▶ Забрать за ${next(l.price)} 🍺</button></div>
          </div>
        </article>`;
      }

      const VARIANTS = [
        {
          key: '0',
          name: 'Как сейчас',
          desc: 'Правила нет: все карточки в ячейках 1/3; широкое вписывается в свою ячейку (мелко).',
          render: (l) => cellCard(l),
        },
        {
          key: 'A',
          name: 'Полоса: медиа слева',
          desc: 'Широкое (16:9) — полоса во всю строку: медиа слева, владелец/название/кнопка справа.',
          render: (l) => (kindOf(l) === 'wide' ? wideA(l) : cellCard(l)),
        },
        {
          key: 'B',
          name: 'Полоса: медиа сверху',
          desc: 'Широкое — полоса: кадр-баннер во всю ширину сверху, инфо-строка (название + кнопка) снизу.',
          render: (l) => (kindOf(l) === 'wide' ? wideB(l) : cellCard(l)),
        },
        {
          key: 'C',
          name: 'Полоса: инфо поверх',
          desc: 'Широкое — кадр во всю ширину целиком (пропорция видео), а владелец/название/кнопка — плашкой поверх низа кадра. Отдельного поля справа нет.',
          render: (l) => (kindOf(l) === 'wide' ? wideC(l) : cellCard(l)),
        },
        {
          key: 'D',
          name: 'Полоса: медиа шире',
          desc: 'Как A, но медиа занимает ~72% ширины, инфо-колонка узкая и выровнена по центру — не пустует.',
          render: (l) => (kindOf(l) === 'wide' ? wideD(l) : cellCard(l)),
        },
      ];

      const feed = document.getElementById('feed');
      const hint = document.getElementById('hint');
      const slabel = document.getElementById('slabel');
      const SQUARE_LABELS = {
        crop: 'как портрет (обрезка)',
        blur: 'размытая подложка',
        cell: 'квадрат 1:1',
        span2: 'две колонки',
      };

      function render(key) {
        const v = VARIANTS.find((x) => x.key === key) ?? VARIANTS[0];
        const counts = LOTS.reduce((a, l) => ((a[kindOf(l)] = (a[kindOf(l)] || 0) + 1), a), {});
        hint.textContent = `Вариант ${v.key} «${v.name}»: ${v.desc} Всего ${LOTS.length} лотов — портрет ${counts.portrait || 0}, квадрат ${counts.square || 0}, широкое ${counts.wide || 0}. Квадрат: ${SQUARE_LABELS[STATE.square]}.`;
        slabel.textContent = `${v.key} · ${v.name}`;
        feed.classList.toggle('dense', STATE.dense === 'on');
        feed.innerHTML = LOTS.map(v.render).join('');
      }

      function currentKey() {
        const k = new URLSearchParams(location.search).get('variant');
        return VARIANTS.some((v) => v.key === k) ? k : 'B';
      }

      let active = currentKey();
      function setVariant(key) {
        active = key;
        try {
          const url = new URL(location.href);
          url.searchParams.set('variant', key);
          history.replaceState(null, '', url);
        } catch {
          /* file:// — просто отрисуем */
        }
        render(key);
      }

      function cycle(step) {
        const i = VARIANTS.findIndex((v) => v.key === active);
        setVariant(VARIANTS[(i + step + VARIANTS.length) % VARIANTS.length].key);
      }

      document.getElementById('prev').addEventListener('click', () => cycle(-1));
      document.getElementById('next').addEventListener('click', () => cycle(1));
      document.addEventListener('keydown', (e) => {
        const t = e.target;
        if (
          t instanceof HTMLElement &&
          (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)
        )
          return;
        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          cycle(-1);
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          cycle(1);
        }
      });

      document.addEventListener('click', (e) => {
        if (e.target.closest('.play, .btn')) e.preventDefault();
      });

      document.getElementById('square-seg').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-square]');
        if (!btn) return;
        STATE.square = btn.dataset.square;
        document
          .querySelectorAll('#square-seg button')
          .forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
        render(active);
      });

      document.getElementById('dense-seg').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-dense]');
        if (!btn) return;
        STATE.dense = btn.dataset.dense;
        document
          .querySelectorAll('#dense-seg button')
          .forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
        render(active);
      });

      setVariant(active);
    </script>
