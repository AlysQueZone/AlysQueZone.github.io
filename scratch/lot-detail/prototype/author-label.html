<!--
  ПРОТОТИП (throwaway) — подача подписи «Привет добавил <ник>» (Автор привета).

  Вопрос: как показать автора привета на открытой карточке лота? Первая версия
  (в общем прототипе lot-detail.html) забракована: ник тёплым «мутно-коричневым»
  акцентом (--color-ember-deep), читается плохо и не нравится.

  Этот файл показывает ОДНУ надпись в живом контексте раскладки B: медиа слева,
  заголовок → надпись → кнопка покупки справа, история снизу. Меняется только
  надпись; всё остальное зафиксировано, чтобы сравнивать честно.

  Варианты (переключатель ← → или ?variant=1..5), описание — сверху:
    1 «Тихая строка»   — без рамки: подпись капсом + ник чернилами.
    2 «Чип, чернила»    — геометрия кнопки, ник чернилами (без цветного акцента).
    3 «Чип, маджента»   — то же, ник маджентой канала (--color-stream).
    4 «Тёмная плашка»   — инверсия: тёмная подложка, ник кремом.
    5 «Ник + автор»     — плашка геометрии кнопки, внутри только ник (чернилами)
                          и бейдж «автор» — тот же, что в истории перепродаж.

  Цвета ника по вариантам названы в описании явно: это главный предмет выбора.

  Оговорки throwaway (как у соседей в scratch/):
    - НЕ часть сборки, отдельный HTML вне Astro;
    - токены/шрифты повторены вручную (Tailwind в файле нет);
    - данные — статический слепок прод-БД (лот с автором в проде ровно один);
    - постер/видео — хотлинком с CDN канала.
-->

    <style>
      :root {
        color-scheme: light;
        --color-void: #fff6bf;
        --color-panel: #ffe6ac;
        --color-card: #f0c46c;
        --color-milk: #422006;
        --color-mist: #744210;
        --color-stream: #c2187b;
        --color-legend: #b3127a;
        --color-cream: #fffbea;
        --color-pivko: #7a5f00;
        --font-display: 'Press Start 2P', 'Rubik', system-ui, sans-serif;
        --font-sans: 'Rubik', system-ui, -apple-system, sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background-color: var(--color-void);
        color: var(--color-milk);
        font-family: var(--font-sans);
        min-height: 100vh;
        padding-bottom: 8rem;
        -webkit-font-smoothing: antialiased;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .muted {
        color: var(--color-mist);
      }

      /* Шапка прототипа + нижний переключатель (не часть макета). */
      .proto-top {
        position: sticky;
        top: 0;
        z-index: 40;
        background: var(--color-milk);
        color: var(--color-cream);
        padding: 0.6rem 0.9rem;
        border-bottom: 3px solid var(--color-milk);
      }

      .proto-top .brand {
        font-family: var(--font-display);
        font-size: 10px;
        line-height: 1.7;
        text-transform: uppercase;
      }

      .proto-top .desc {
        margin-top: 0.35rem;
        font-size: 13px;
        font-weight: 700;
        max-width: 60rem;
        line-height: 1.45;
      }

      .proto-top .desc b {
        color: #ffd98a;
      }

      .proto-bottom {
        position: fixed;
        left: 50%;
        bottom: 0.9rem;
        transform: translateX(-50%);
        z-index: 50;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: var(--color-milk);
        color: var(--color-cream);
        border: 3px solid var(--color-cream);
        border-radius: 8px;
        box-shadow: 4px 4px 0 rgba(66, 32, 6, 0.35);
        padding: 0.35rem 0.5rem;
      }

      .proto-bottom button {
        font: inherit;
        font-weight: 900;
        font-size: 16px;
        line-height: 1;
        width: 2rem;
        height: 2rem;
        border: 2px solid var(--color-cream);
        border-radius: 5px;
        background: transparent;
        color: var(--color-cream);
        cursor: pointer;
      }

      .proto-bottom button:hover {
        background: rgba(255, 251, 234, 0.18);
      }

      .proto-bottom .label {
        min-width: 13rem;
        text-align: center;
        font-size: 12px;
      }

      .proto-bottom .label b {
        font-family: var(--font-display);
        font-size: 10px;
      }

      /* Токены макета (повтор global.css). */
      .card-pixel {
        background-color: var(--color-panel);
        border: 3px solid var(--color-milk);
        box-shadow: 6px 6px 0 var(--color-milk);
        border-radius: 4px;
      }

      .badge-pixel {
        display: inline-block;
        font-family: var(--font-display);
        font-size: 9px;
        line-height: 1.7;
        padding: 4px 8px;
        border-radius: 2px;
        text-transform: uppercase;
      }

      .btn-arcade {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.25rem;
        min-height: 2.75rem;
        border: 3px solid var(--color-milk);
        box-shadow: 4px 4px 0 var(--color-milk);
        border-radius: 4px;
        font-weight: 900;
        text-transform: uppercase;
        cursor: pointer;
        font-size: 1rem;
        font-family: inherit;
        padding: 0.5rem 1.2rem;
      }

      .btn-arcade-primary {
        background-color: var(--color-stream);
        color: var(--color-cream);
      }

      .wrap {
        max-width: 60rem;
        margin: 0 auto;
        padding: 1rem;
      }

      .back {
        font-size: 14px;
        font-weight: 800;
        color: var(--color-stream);
      }

      .lot-title {
        font-size: 1.5rem;
        font-weight: 900;
        line-height: 1.25;
      }

      /* Раскладка B. */
      .b-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.25rem;
        align-items: start;
        margin-top: 1rem;
      }

      .b-info {
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
      }

      .b-deal {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 0.15rem 0.6rem;
        align-items: baseline;
        border: 2px solid var(--color-milk);
        background: var(--color-void);
        padding: 0.45rem 0.6rem;
      }

      .b-deal + .b-deal {
        margin-top: 0.4rem;
      }

      .b-deal .when {
        grid-column: 1 / -1;
        color: var(--color-mist);
        font-size: 12px;
        font-weight: 700;
      }

      .who {
        font-weight: 800;
      }

      .arrow {
        color: var(--color-mist);
        margin: 0 0.3rem;
      }

      .price {
        font-weight: 900;
        color: var(--color-pivko);
        white-space: nowrap;
      }

      .hist-head {
        font-family: var(--font-display);
        font-size: 10px;
        line-height: 1.7;
        text-transform: uppercase;
      }

      /* Плашки одной ширины: подпись автора и кнопка покупки — во всю колонку. */
      .b-info .btn-arcade {
        width: 100%;
      }

      .mark {
        display: inline-block;
        font-family: var(--font-display);
        font-size: 8px;
        line-height: 1.7;
        padding: 1px 5px;
        border-radius: 2px;
        text-transform: uppercase;
      }

      .mark-author {
        background: var(--color-legend);
        color: var(--color-cream);
      }

      .mark-mine {
        background: var(--color-pivko);
        color: var(--color-cream);
      }

      /* Кадр + бейджи (упрощённый lot-media-frame). */
      .frame {
        position: relative;
        width: 100%;
        max-width: 28rem;
        overflow: hidden;
        border: 2px solid var(--color-milk);
        background: #000;
        aspect-ratio: 1 / 1;
      }

      .frame img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .frame .play {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.35);
        border: 0;
        cursor: pointer;
      }

      .frame .play span {
        background: var(--color-stream);
        color: var(--color-cream);
        border: 3px solid var(--color-milk);
        box-shadow: 3px 3px 0 var(--color-milk);
        padding: 0.4rem 0.8rem;
        font-weight: 900;
        text-transform: uppercase;
        font-size: 12px;

      .frame .badge-pixel {
        position: absolute;

      .frame .owner-badge {
        top: 0.5rem;
        left: 0.5rem;
        background: var(--color-milk);
        color: var(--color-cream);
        max-width: 85%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;

      .frame .mine-badge {
        top: 0.5rem;
        right: 0.5rem;
        background: var(--color-pivko);
        color: var(--color-cream);
      }

        align-self: stretch;
        width: 100%;
      }

      .al-cap {
        font-family: var(--font-display);
        font-size: 8px;
        line-height: 1.7;
        text-transform: uppercase;
        color: var(--color-mist);

      .al-nick {
        font-weight: 900;
        font-size: 1.05rem;
        word-break: break-all;
      }

      /* 1 «Тихая строка» — без рамки, ник чернилами. */
      .al-plain {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
      }

      .al-plain .al-nick {
        color: var(--color-milk);
      }

        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        min-height: 2.75rem;
        border: 3px solid var(--color-milk);
        border-radius: 4px;
        box-shadow: 4px 4px 0 color-mix(in srgb, var(--color-milk) 30%, transparent);
        padding: 0.4rem 0.8rem;
        background: var(--color-void);
      }

      /* 2 «Чип, чернила» — ник основным цветом текста. */
      .al-chip .al-nick {
        color: var(--color-milk);
      }

      /* 3 «Чип, маджента» — ник цветом кнопки покупки. */
      .al-chip-magenta .al-nick {
        color: var(--color-stream);
      }

      /* 4 «Тёмная плашка» — инверсия, ник кремом. */
      .al-dark {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        min-height: 2.75rem;
        border: 3px solid var(--color-milk);
        border-radius: 4px;
        box-shadow: 4px 4px 0 color-mix(in srgb, var(--color-milk) 30%, transparent);
        padding: 0.4rem 0.8rem;
        background: var(--color-milk);
      }

      .al-dark .al-cap {
        color: var(--color-cream);
      }

      .al-dark .al-nick {
        color: var(--color-cream);
      }

      /* 5 «Ник + автор» — плашка геометрии кнопки: только ник и бейдж. */
      .al-bar {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
        min-height: 2.75rem;
        border: 3px solid var(--color-milk);
        border-radius: 4px;
        box-shadow: 4px 4px 0 color-mix(in srgb, var(--color-milk) 30%, transparent);
        padding: 0.4rem 0.8rem;
        background: var(--color-void);
      }

      .al-bar .al-nick {
        color: var(--color-milk);
      }

      .al-tag {
        background: var(--color-legend);
        color: var(--color-cream);
      }

      @media (min-width: 900px) {
        .b-grid {
          grid-template-columns: minmax(0, 26rem) minmax(0, 1fr);
          grid-template-areas:
            'media info'
            'media history';
        }

        .b-media {
          grid-area: media;
        }

        .b-info {
          grid-area: info;
        }

        .b-history {
          grid-area: history;
        }
      }

          key: '1',
          name: 'Тихая строка',
          desc: 'Без рамки и тени: подпись капсом, ник <b>чернилами</b> (--color-milk). Самый спокойный вариант — «ещё одна строка текста» под заголовком.',

          name: 'Чип, чернила',
          desc: 'Геометрия кнопки (рамка, высота, тень), но ник <b>чернилами</b> (--color-milk): выделяет только рамка, цвета ника нет.',

          key: '3',
          name: 'Чип, маджента',
          desc: 'Как вариант 2, ник <b>маджентой канала</b> (--color-stream, тот же цвет, что у кнопки «Забрать») — контраст 5.2:1.',

          desc: 'Инверсия: тёмная подложка (--color-milk), ник <b>кремом</b> (--color-cream). Самый «весомый» вариант; но тёмная плашка — тот же приём, что у бейджа владельца.',
        },

          key: '5',
          name: 'Ник + автор',
          desc: 'ВЫБРАНО (после правки): плашка геометрии кнопки, внутри — только ник <b>чернилами</b> (--color-milk) и бейдж «автор» (--color-legend), тот же, что в истории перепродаж. Подписи «Привет добавил» и толстой полосы слева нет.',
        },
      ];

      const S = { variant: '1' };

      function fmtRel(iso) {
        const d = new Date(iso);
        const sec = Math.max(0, (Date.now() - d.getTime()) / 1000);
        if (sec < 60) return 'только что';
        const min = Math.floor(sec / 60);
        if (min < 60) return `${min} мин назад`;
        const hr = Math.floor(min / 60);
        if (hr < 24) return `${hr} ч назад`;
        const day = Math.floor(hr / 24);
        if (day === 1) return 'вчера';
        if (day < 7) return `${day} дн назад`;
        return new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'short' }).format(d);
      }

      function esc(s) {
        return String(s ?? '').replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]
        );
      }

      const VIEW = RAW.view.find((v) => v.slug === AUTHOR_SLUG) ?? RAW.view[0];
      const HISTORY = (RAW.history[AUTHOR_SLUG] || []).slice().reverse();
      const AUTHOR = VIEW.suggested_by_login;

      /** Пять разметок одной надписи — разница только в обёртке/цвете ника. */
      function authorLabel(variant) {
        const nick = `<span class="al-nick">${esc(AUTHOR)}</span>`;
        const cap = '<span class="al-cap">Привет добавил</span>';
        switch (variant) {
          case '1':
            return `<p class="al al-plain">${cap}${nick}</p>`;
          case '2':
            return `<span class="al al-chip">${cap}${nick}</span>`;
          case '3':
            return `<span class="al al-chip al-chip-magenta">${cap}${nick}</span>`;
          case '4':
            return `<span class="al al-dark">${cap}${nick}</span>`;
          case '5':
            return `<span class="al al-bar">${nick}<span class="badge-pixel al-tag">автор</span></span>`;
          default:
            return '';
        }
      }

      function historyBlock() {
        const rows = HISTORY.map((d) => {
          const mine = d.uid === ME ? '<span class="mark mark-mine">ТВОЙ</span>' : '';
          const isAuthor = d.seller === AUTHOR ? '<span class="mark mark-author">автор</span>' : '';
          return `<li class="b-deal">
              <span><span class="who">${esc(d.seller ?? 'Биржа')}</span><span class="arrow">→</span><span class="who">${esc(d.buyer)}</span> ${mine}${isAuthor}</span>
              <span class="price">${d.price} 🍺</span>
              <span class="when">${fmtRel(d.at)}</span>
            </li>`;
        }).join('');
        return `<ul>${rows}</ul>`;
      }

      function render() {
        const html = `<div class="lot">
          <a class="back" href="#">← Назад на биржу</a>
          <div class="b-grid">
            <div class="card-pixel b-media" style="padding:1rem">
              <div class="frame">
                <img src="${esc(VIEW.video_url.replace(/\.webm$/, '.webp'))}" alt="${esc(VIEW.title)}" />
                <button class="play" type="button"><span>▶ смотреть</span></button>
                <span class="badge-pixel owner-badge">👑 ${esc(VIEW.owner_login)}</span>
                <span class="badge-pixel mine-badge">Твой</span>
              </div>
            </div>
            <article class="card-pixel b-info" style="padding:1.25rem">
              <h1 class="lot-title">${esc(VIEW.title)}</h1>
              ${authorLabel(S.variant)}
              <div><button class="btn-arcade" type="button" disabled>Твой привет</button></div>
            </article>
            <section class="card-pixel b-history" style="padding:1rem">
              <h2 class="hist-head">История перепродаж</h2>
              <div style="margin-top:.75rem">${historyBlock()}</div>
            </section>
          </div>
        </div>`;
        document.getElementById('app').innerHTML = html;
        const v = VARIANTS.find((x) => x.key === S.variant);
        document.querySelector('[data-variant-label]').innerHTML = `<b>${v.key}</b> · ${v.name}`;
        document.querySelector('[data-desc]').innerHTML = v.desc;
      }

      function syncUrl() {
        const url = new URL(location.href);
        url.searchParams.set('variant', S.variant);
        history.replaceState(null, '', url);
      }

      document.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-act]');
        if (!btn) return;
        if (btn.dataset.act === 'prev' || btn.dataset.act === 'next') {
          const i = VARIANTS.findIndex((v) => v.key === S.variant);
          const next =
            (i + (btn.dataset.act === 'next' ? 1 : VARIANTS.length - 1)) % VARIANTS.length;
          S.variant = VARIANTS[next].key;
          syncUrl();
          render();
        }
      });

      (function init() {
        const v = new URLSearchParams(location.search).get('variant');
        if (VARIANTS.some((x) => x.key === v)) S.variant = v;
        render();
      })();
