<!doctype html>
<!--
  ПРОТОТИП (throwaway) — страница открытой карточки лота (/lot/?id=…).

  Вопрос: как выглядит рефактор «открытой карточки» под новые условия из
  TODO (раздел «UI»):
    1. История перекупов с датами и временем (в БД время UTC → локальная
       зона браузера; без изменений в БД).
    2. Подгрузка истории пагинацией («Показать ещё», новые сверху, курсорная
       пагинация в проде — при открытом списке новая сделка дописывается
       сверху, окно не прыгает).
    3. Автор привета выделен явно и заметно (сейчас — бледная строка).

  Три варианта (структурно разные, не по цвету), переключение ← → или
  ?variant=A|B|C:
    A «Сейчас+»        — один столбец, минимум изменений от текущей страницы.
    B «Двухколоночный» — на десктопе медиа-колонка + колонка информации и
                         истории; на мобильном схлопывается в один столбец.
    C «Журнал»         — история-герой: таймлайн сделок, медиа компактное.

  Пять демо-лотов (настоящий слепок из прод-БД, ники как есть), ?lot=<slug>:
    1. lot-sub-melkij-strateg-2   — единственный лот с автором (автор ≠ владелец)
    2. lot-privet-olyacaramel     — 50 перекупов (пагинация)
    3. lot-privet-evilzerg57-double — единственное ШИРОКОЕ видео (16:9)
    4. lot-privet-purpletie       — 1 перекуп (почти пусто)
    5. DEMO                       — синтетика: автор ещё владеет, 0 перекупов
                                    (у всех продовых лотов есть ≥1 перекуп)

  Прочие переключатели (сверху): время — относительное / точное / оба;
  кнопка «+ живой перекуп» — вставляет новую сделку сверху, как это сделает
  Realtime в проде. В прототипе «ты» = spiritbanbanban (метка «ТВОЙ»).

  Оговорки throwaway (как у соседей в scratch/):
    - НЕ часть сборки, отдельный HTML вне Astro;
    - токены/шрифты повторены вручную (Tailwind в файле нет);
    - данные — статический слепок; покупка декоративная, ничего не покупает;
    - постеры/видео — хотлинком с CDN канала.
-->

      :root {

      *,

      body {

      }

      h1,
      h2,
      h3,
      p,
      ul,
      ol,
      li {

        padding: 0;
      }

      ul,
      ol {

      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .display {
        font-family: var(--font-display);
      }

      .muted {
        color: var(--color-mist);
      }

      .hidden {
        display: none !important;
      }

      /* ---------------------------------------------------------------- *
       * Шапка прототипа + нижний переключатель вариантов (не часть макета) *
       * ---------------------------------------------------------------- */

      .proto-top {
        position: sticky;
        top: 0;
        z-index: 40;
        background: var(--color-milk);
        color: var(--color-cream);
        padding: 0.5rem 0.9rem;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem 0.8rem;
        border-bottom: 3px solid var(--color-milk);
      }

      .proto-top .brand {
        font-family: var(--font-display);
        font-size: 10px;
        line-height: 1.7;
        text-transform: uppercase;
      }

      .proto-top .note {
        font-size: 12px;
        font-weight: 700;
        opacity: 0.85;
      }

      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
      }

      .tab,
      .proto-btn {
        font: inherit;
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
        border: 2px solid var(--color-cream);
        border-radius: 3px;
        padding: 0.25rem 0.5rem;
        background: transparent;
        color: var(--color-cream);
      }

      .tab:hover,
      .proto-btn:hover {
        background: rgba(255, 251, 234, 0.18);
      }

      .tab[aria-current='true'] {
        background: var(--color-cream);
        color: var(--color-milk);
      }

      .proto-bottom {
        position: fixed;
        left: 50%;
        bottom: 0.9rem;
        transform: translateX(-50%);
        z-index: 50;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: var(--color-milk);
        color: var(--color-cream);
        border: 3px solid var(--color-cream);
        border-radius: 8px;
        box-shadow: 4px 4px 0 rgba(66, 32, 6, 0.35);
        padding: 0.35rem 0.5rem;
      }

      .proto-bottom button {
        font: inherit;
        font-weight: 900;
        font-size: 16px;
        line-height: 1;
        width: 2rem;
        height: 2rem;
        border: 2px solid var(--color-cream);
        border-radius: 5px;
        background: transparent;
        color: var(--color-cream);
        cursor: pointer;
      }

      .proto-bottom button:hover {
        background: rgba(255, 251, 234, 0.18);
      }

      .proto-bottom .label {
        min-width: 12rem;
        text-align: center;
        font-size: 12px;
      }

      .proto-bottom .label b {
        font-family: var(--font-display);
        font-size: 10px;
      }

      /* ---------------------------------------------------------------- *
       * Токены макета (повтор global.css)                                 *
       * ---------------------------------------------------------------- */

      .card-pixel {
        background-color: var(--color-panel);
        border: 3px solid var(--color-milk);
        box-shadow: 6px 6px 0 var(--color-milk);
        border-radius: 4px;
      }

      .badge-pixel {
        display: inline-block;
        font-family: var(--font-display);
        font-size: 9px;
        line-height: 1.7;
        padding: 4px 8px;
        border-radius: 2px;
        text-transform: uppercase;
      }

      .btn-arcade {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.25rem;
        min-height: 2.75rem;
        border: 3px solid var(--color-milk);
        box-shadow: 4px 4px 0 var(--color-milk);
        border-radius: 4px;
        font-weight: 900;
        text-transform: uppercase;
        cursor: pointer;
        font-size: 1rem;
        font-family: inherit;
        padding: 0.5rem 1.2rem;
      }

      .btn-arcade-primary {
        background-color: var(--color-stream);
        color: var(--color-cream);
      }

      .btn-arcade-ghost {
        background-color: transparent;
        color: var(--color-milk);
      }

      .btn-arcade:disabled {
        opacity: 0.5;
        cursor: default;
      }

      /* ---------------------------------------------------------------- *
       * Общие блоки страницы лота                                          *
       * ---------------------------------------------------------------- */

      .wrap {
        max-width: 60rem;
        margin: 0 auto;
        padding: 1rem;
      }

      .back {
        font-size: 14px;
        font-weight: 800;
        color: var(--color-stream);
      }

      .back:hover {
        text-decoration: underline;
      }

      .lot-title {
        font-size: 1.5rem;
        font-weight: 900;
        line-height: 1.25;
      }

      /* Плашка автора привета — заметный акцент (легенда-маджента). */
      .author-plaque {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        background: var(--color-cream);
        border: 3px solid var(--color-legend);
        box-shadow: 4px 4px 0 var(--color-legend);
        border-radius: 4px;
        padding: 0.5rem 0.7rem;
      }

      .author-plaque .ava {
        flex: none;
        width: 2rem;
        height: 2rem;
        display: grid;
        place-items: center;
        background: var(--color-legend);
        color: var(--color-cream);
        font-family: var(--font-display);
        font-size: 12px;
        border-radius: 3px;
      }

      .author-plaque .cap {
        font-family: var(--font-display);
        font-size: 8px;
        line-height: 1.7;
        text-transform: uppercase;
        color: var(--color-mist);
        display: block;
      }

      .author-plaque .nick {
        font-weight: 900;
        font-size: 1.05rem;
        color: var(--color-legend);
        word-break: break-all;
      }

      /* Кадр видео (упрощённый lot-media-frame). */
      .frame {
        position: relative;
        width: 100%;
        max-width: 28rem;
        overflow: hidden;
        border: 2px solid var(--color-milk);
        background: #000;
        aspect-ratio: 1 / 1;
      }

      .frame img,
      .frame video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        z-index: 1;
      }

      .frame .play {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.35);
        border: 0;
        cursor: pointer;
        z-index: 2;
      }

      .frame .play span {
        background: var(--color-stream);
        color: var(--color-cream);
        border: 3px solid var(--color-milk);
        box-shadow: 3px 3px 0 var(--color-milk);
        padding: 0.4rem 0.8rem;
        font-weight: 900;
        text-transform: uppercase;
        font-size: 12px;
      }

      .frame .badge-pixel {
        position: absolute;
        z-index: 3;
      }

      .frame .owner-badge {
        top: 0.5rem;
        left: 0.5rem;
        background: var(--color-milk);
        color: var(--color-cream);
        max-width: 85%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .frame .mine-badge {
        top: 0.5rem;
        right: 0.5rem;
        background: var(--color-pivko);
        color: var(--color-cream);
      }

      /* Широкое видео (16:9): кадр во всю ширину строки. Portrait/square —
         «телефонная» ширина, как на текущей странице лота. */
      .lot[data-orientation='wide'] .frame,
      .lot[data-orientation='square'] .frame {
        max-width: none;
      }

      .lot[data-orientation='portrait'] .frame {
        max-width: 28rem;
      }

      .frame.pending {
        max-width: 28rem;
      }

      /* Метки «ТВОЙ» и «автор» в истории. */
      .mark {
        display: inline-block;
        font-family: var(--font-display);
        font-size: 8px;
        line-height: 1.7;
        padding: 1px 5px;
        border-radius: 2px;
        text-transform: uppercase;
        vertical-align: middle;
      }

      .mark-mine {
        background: var(--color-pivko);
        color: var(--color-cream);
      }

      .mark-author {
        background: var(--color-legend);
        color: var(--color-cream);
      }

      .who {
        font-weight: 800;
        word-break: break-all;
      }

      .arrow {
        color: var(--color-mist);
        margin: 0 0.3rem;
      }

      .price {
        font-weight: 900;
        color: var(--color-pivko);
        white-space: nowrap;
      }

      .when {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        color: var(--color-mist);
        font-size: 12px;
        font-weight: 700;
      }

      body[data-time='rel'] .exact,
      body[data-time='exact'] .rel {
        display: none;
      }

      .hist-head {
        font-family: var(--font-display);
        font-size: 10px;
        line-height: 1.7;
        text-transform: uppercase;
      }

      /* ---------------------------------------------------------------- *
       * Вариант A «Сейчас+»                                               *
       * ---------------------------------------------------------------- */

      .a-col {
        max-width: 34rem;
        margin: 0 auto;
      }

      .a-card {
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .a-deal {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        border: 2px solid var(--color-milk);
        background: var(--color-void);
        box-shadow: 3px 3px 0 var(--color-milk);
        padding: 0.5rem 0.7rem;
      }

      .a-deal .row2 {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 0.6rem;
        flex-wrap: wrap;
      }

      /* ---------------------------------------------------------------- *
       * Вариант B «Двухколоночный»                                         *
       * ---------------------------------------------------------------- */

      .b-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.25rem;
        align-items: start;
      }

      .b-info {
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
      }

      .b-history {
        padding: 1rem;
      }

      .b-deal {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 0.15rem 0.6rem;
        align-items: baseline;
        border: 2px solid var(--color-milk);
        background: var(--color-void);
        padding: 0.45rem 0.6rem;
      }

      .b-deal + .b-deal {
        margin-top: 0.4rem;
      }

      .b-deal .line {
        grid-column: 1;
      }

      .b-deal .price {
        grid-column: 2;
        text-align: right;
      }

      .b-deal .when {
        grid-column: 1 / -1;
      }

      .b-owner-chip {
        align-self: flex-start;
        border: 3px solid var(--color-milk);
        background: var(--color-panel);
        box-shadow: 4px 4px 0 var(--color-milk);
        padding: 0.35rem 0.6rem;
        font-weight: 900;
        font-size: 14px;
      }

      /* ---------------------------------------------------------------- *
       * Вариант C «Журнал»                                                 *
       * ---------------------------------------------------------------- */

      .c-head {
        display: grid;
        grid-template-columns: minmax(0, 9rem) minmax(0, 1fr);
        gap: 1rem;
        align-items: start;
      }

      /* Широкое видео в «Журнале» тоже во всю ширину над текстом. */
      .lot[data-variant='C'][data-orientation='wide'] .c-head {
        grid-template-columns: minmax(0, 1fr);
      }

      .c-head-main {
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
      }

      .c-timeline {
        counter-reset: deal;
      }

      .tl-item {
        position: relative;
        display: grid;
        grid-template-columns: auto 1fr auto;
        grid-template-areas:
          'dot what price'
          'dot when when';
        gap: 0.15rem 0.8rem;
        padding: 0 0 1rem 1.6rem;
      }

      /* Вертикальная рельса таймлайна. */
      .tl-item::before {
        content: '';
        position: absolute;
        left: 0.4rem;
        top: 1rem;
        bottom: -0.2rem;
        width: 3px;
        background: var(--color-card);
      }

      .tl-item:last-child::before {
        display: none;
      }

      .tl-dot {
        grid-area: dot;
        position: absolute;
        left: 0;
        top: 0.35rem;
        width: 0.9rem;
        height: 0.9rem;
        background: var(--color-void);
        border: 3px solid var(--color-milk);
        border-radius: 50%;
      }

      .tl-item.newest .tl-dot {
        background: var(--color-legend);
        border-color: var(--color-legend);
      }

      .tl-what {
        grid-area: what;
        font-size: 14px;
      }

      .tl-price {
        grid-area: price;
        text-align: right;
      }

      .tl-when {
        grid-area: when;
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        color: var(--color-mist);
        font-size: 12px;
        font-weight: 700;
      }

      /* ---------------------------------------------------------------- *
       * Десктоп                                                            *
       * ---------------------------------------------------------------- */

      @media (min-width: 900px) {
        /* B: портрет/квадрат — медиа в левой колонке на обе строки; широкое
           видео вырывается на всю ширину над колонками (Q7, вариант а). */
        .lot[data-variant='B'] .b-grid {
          grid-template-columns: minmax(0, 26rem) minmax(0, 1fr);
        }

        .lot[data-variant='B'] .b-media {
          grid-area: media;
        }

        .lot[data-variant='B'] .b-info {
          grid-area: info;
        }

        .lot[data-variant='B'] .b-history {
          grid-area: history;
        }

        .lot[data-variant='B']:not([data-orientation='wide']) .b-grid {
          grid-template-areas:
            'media info'
            'media history';
        }

        .lot[data-variant='B'][data-orientation='wide'] .b-grid {
          grid-template-areas:
            'media media'
            'info history';
        }

        .c-head {
          grid-template-columns: minmax(0, 16rem) minmax(0, 1fr);
        }
      }
    </style>
  </head>

        const d = new Date(iso);

        return SHORT_FMT.format(d);

      // Подготовка сущностей                                               //
      // ------------------------------------------------------------------ //

      function currentLot() {
        return LOTS.find((l) => l.slug === state.lot) ?? LOTS[0];
      }

      /** Сделки: живые (сверху) + история новыми первыми. */
      function dealsNewestFirst(lot) {
        const hist = lot.history.slice().reverse();
        const live = state.live.filter((x) => x.slug === lot.slug);
        return [...live, ...hist];
      }

      function isMine(deal) {
        return deal.uid === ME;
      }

      function isAuthor(deal, lot) {
        return Boolean(lot.author) && deal.seller === lot.author;
      }

      function marks(deal, lot) {
        let out = '';
        if (isMine(deal)) out += '<span class="mark mark-mine">ТВОЙ</span>';
        if (isAuthor(deal, lot)) out += '<span class="mark mark-author">автор</span>';
        return out;
      }

      function authorPlaque(lot) {
        if (!lot.author) return '';
        const initial = esc(lot.author.slice(0, 1).toUpperCase());
        return `<div class="author-plaque">
          <span class="ava" aria-hidden="true">${initial}</span>
          <span>
            <span class="cap">Привет добавил</span>
            <span class="nick">${esc(lot.author)}</span>
          </span>
        </div>`;
      }

      function mediaBlock(lot) {
        const owner = lot.owner
          ? `<span class="badge-pixel owner-badge">👑 ${esc(lot.owner)}</span>`
          : '';
        const mineBadge = isOwnedByMe(lot)
          ? '<span class="badge-pixel mine-badge">Твой</span>'
          : '';
        return `<div class="frame pending" data-frame>
          <img data-poster src="${esc(lot.poster)}" alt="${esc(lot.title)}" />
          <button class="play" type="button" data-act="play" aria-label="Смотреть видео">
            <span>▶ смотреть</span>
          </button>
          ${owner}${mineBadge}
        </div>`;
      }

      function isOwnedByMe(lot) {
        return lot.ownerUid === ME;
      }

      function buyButton(lot) {
        if (isOwnedByMe(lot)) {
          return '<button class="btn-arcade" type="button" disabled>Твой привет</button>';
        }
        return `<button class="btn-arcade btn-arcade-primary" type="button" data-act="buy">▶ Забрать за ${lot.nextPrice} 🍺</button>`;
      }

      // ------------------------------------------------------------------ //
      // История: список + «Показать ещё»                                    //
      // ------------------------------------------------------------------ //

      const EMPTY =
        '<p class="muted" style="font-weight:800">Пока никто не забирал — стань первым</p>';

      function moreButton(lot) {
        const total = dealsNewestFirst(lot).length;
        if (state.pages * PAGE >= total) return '';
        return '<div style="margin-top:.75rem;display:flex;justify-content:center"><button class="btn-arcade btn-arcade-ghost" type="button" data-act="more">Показать ещё</button></div>';
      }

      function historyBody(lot, variant) {
        if (
          lot.history.length === 0 &&
          state.live.filter((x) => x.slug === lot.slug).length === 0
        ) {
          return EMPTY + moreButton(lot);
        }
        const deals = dealsNewestFirst(lot).slice(0, state.pages * PAGE);
        const items = deals.map((d) => dealRow(d, lot, variant)).join('');
        const tag = variant === 'C' ? 'ol' : 'ul';
        return `<${tag}>${items}</${tag}>${moreButton(lot)}`;
      }

      function dealRow(d, lot, variant) {
        const seller = esc(d.seller ?? 'Биржа');
        const buyer = esc(d.buyer);
        if (variant === 'C') {
          const newest = state.live.some((x) => x.id === d.id && x.slug === lot.slug);
          return `<li class="tl-item${newest ? ' newest' : ''}">
            <span class="tl-dot" aria-hidden="true"></span>
            <span class="tl-what"><span class="who">${seller}</span><span class="arrow">→</span><span class="who">${buyer}</span> ${marks(d, lot)}</span>
            <span class="tl-price price">${d.price} 🍺</span>
            <span class="tl-when">${when(d.at)}</span>
          </li>`;
        }
        if (variant === 'B') {
          return `<li class="b-deal">
            <span class="line"><span class="who">${seller}</span><span class="arrow">→</span><span class="who">${buyer}</span> ${marks(d, lot)}</span>
            <span class="price">${d.price} 🍺</span>
            <span class="when">${when(d.at)}</span>
          </li>`;
        }
        return `<li class="a-deal">
          <span class="row2">
            <span><span class="who">${seller}</span><span class="arrow">→</span><span class="who">${buyer}</span> ${marks(d, lot)}</span>
            <span class="price">${d.price} 🍺</span>
          </span>
          <span class="row2">${when(d.at)}</span>
        </li>`;
      }

      // ------------------------------------------------------------------ //
      // Варианты                                                            //
      // ------------------------------------------------------------------ //

      function variantA(lot) {
        return `<div class="lot a-col" data-variant="A">
          <a class="back" href="#">← Назад на биржу</a>
          <article class="card-pixel a-card" style="margin-top:1rem">
            <h1 class="lot-title">${esc(lot.title)}${lot.synthetic ? ' <span class="mark mark-author">демо</span>' : ''}</h1>
            ${authorPlaque(lot)}
            ${mediaBlock(lot)}
            <div>${buyButton(lot)}</div>
          </article>
          <section class="card-pixel" style="margin-top:1.5rem;padding:1.25rem">
            <h2 class="hist-head">История перепродаж</h2>
            <div data-history-body style="margin-top:.75rem">${historyBody(lot, 'A')}</div>
          </section>
        </div>`;
      }

      function variantB(lot) {
        const ownerChip = lot.owner
          ? `<span class="b-owner-chip">👑 Владелец: ${esc(lot.owner)}${isOwnedByMe(lot) ? ' (ты)' : ''}</span>`
          : '<span class="b-owner-chip muted">Свободен</span>';
        return `<div class="lot" data-variant="B">
          <a class="back" href="#">← Назад на биржу</a>
          <div class="b-grid" style="margin-top:1rem">
            <div class="card-pixel b-media" style="padding:1rem">${mediaBlock(lot)}</div>
            <article class="card-pixel b-info" style="padding:1.25rem">
              <h1 class="lot-title">${esc(lot.title)}${lot.synthetic ? ' <span class="mark mark-author">демо</span>' : ''}</h1>
              ${authorPlaque(lot)}
              ${ownerChip}
              <div>${buyButton(lot)}</div>
            </article>
            <section class="card-pixel b-history">
              <h2 class="hist-head">История перепродаж</h2>
              <div data-history-body style="margin-top:.75rem">${historyBody(lot, 'B')}</div>
            </section>
          </div>
        </div>`;
      }

      function variantC(lot) {
        const ownerChip = lot.owner
          ? `<span class="b-owner-chip">👑 ${esc(lot.owner)}${isOwnedByMe(lot) ? ' (ты)' : ''}</span>`
          : '<span class="b-owner-chip muted">Свободен</span>';
        return `<div class="lot" data-variant="C">
          <a class="back" href="#">← Назад на биржу</a>
          <div class="c-head card-pixel" style="margin-top:1rem;padding:1rem">
            <div class="c-media">${mediaBlock(lot)}</div>
            <div class="c-head-main">
              <h1 class="lot-title">${esc(lot.title)}${lot.synthetic ? ' <span class="mark mark-author">демо</span>' : ''}</h1>
              ${authorPlaque(lot)}
              <div style="display:flex;gap:.6rem;align-items:center;flex-wrap:wrap">${ownerChip}</div>
              <div>${buyButton(lot)}</div>
            </div>
          </div>
          <section class="card-pixel" style="margin-top:1.5rem;padding:1.25rem">
            <h2 class="hist-head">История перепродаж</h2>
            <div data-history-body style="margin-top:1rem">${historyBody(lot, 'C')}</div>
          </section>
        </div>`;
      }

      const RENDER = { A: variantA, B: variantB, C: variantC };

      // ------------------------------------------------------------------ //
      // Рисование + привязки                                               //
      // ------------------------------------------------------------------ //

      const app = document.getElementById('app');

      function renderTabs() {
        document.querySelector('[data-lot-tabs]').innerHTML = LOTS.map(
          (l) =>
            `<button class="tab" type="button" data-act="lot" data-lot="${esc(l.slug)}" aria-current="${l.slug === state.lot}">${esc(l.title)}${l.synthetic ? ' (демо)' : ''}</button>`
        ).join('');
        const v = VARIANTS.find((x) => x.key === state.variant);
        document.querySelector('[data-variant-label]').innerHTML = `<b>${v.key}</b> · ${v.name}`;
        const timeLabel = { rel: 'время: относительно', exact: 'время: точно', both: 'время: оба' }[
          state.time
        ];
        document.querySelector('[data-act="time"]').textContent = timeLabel;
      }

      function syncUrl() {
        const url = new URL(location.href);
        url.searchParams.set('variant', state.variant);
        url.searchParams.set('lot', state.lot);
        url.searchParams.set('time', state.time);
        history.replaceState(null, '', url);
      }

      function render() {
        const lot = currentLot();
        app.innerHTML = RENDER[state.variant](lot);
        document.body.dataset.time = state.time;
        renderTabs();
        bindPosters();
      }

      /** Ориентация кадра по фактической пропорции постера (как lib/lot-video.ts). */
      function applyOrientation(img) {
        const w = img.naturalWidth;
        const h = img.naturalHeight;
        if (!w || !h) return;
        const ratio = w / h;
        const o = ratio >= 1.2 ? 'wide' : ratio >= 0.9 ? 'square' : 'portrait';
        const lotEl = img.closest('.lot');
        const frame = img.closest('[data-frame]');
        if (frame) {
          frame.style.aspectRatio = `${w} / ${h}`;
          frame.classList.remove('pending');
        }
        if (lotEl) lotEl.dataset.orientation = o;
      }

      function bindPosters() {
        app.querySelectorAll('img[data-poster]').forEach((img) => {
          if (img.complete && img.naturalWidth > 0) applyOrientation(img);
          else img.addEventListener('load', () => applyOrientation(img), { once: true });
        });
      }

      /** Обновить только тело истории (пагинация/живой перекуп — без прыжка). */
      function refreshHistory() {
        const lot = currentLot();
        app.querySelectorAll('[data-history-body]').forEach((el) => {
          el.innerHTML = historyBody(lot, state.variant);
        });
      }

      document.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-act]');
        if (!btn) return;
        const act = btn.dataset.act;
        if (act === 'prev' || act === 'next') {
          const i = VARIANTS.findIndex((v) => v.key === state.variant);
          const next = (i + (act === 'next' ? 1 : VARIANTS.length - 1)) % VARIANTS.length;
          state.variant = VARIANTS[next].key;
          syncUrl();
          render();
          return;
        }
        if (act === 'lot') {
          state.lot = btn.dataset.lot;
          state.pages = 1;
          state.live = [];
          syncUrl();
          render();
          return;
        }
        if (act === 'time') {
          const order = ['both', 'rel', 'exact'];
          state.time = order[(order.indexOf(state.time) + 1) % order.length];
          syncUrl();
          render();
          return;
        }
        if (act === 'more') {
          state.pages += 1;
          refreshHistory();
          return;
        }
        if (act === 'live') {
          const lot = currentLot();
          const maxId = Math.max(
            0,
            ...lot.history.map((h) => h.id),
            ...state.live.map((x) => x.id)
          );
          const price = lot.nextPrice;
          state.live.unshift({
            slug: lot.slug,
            id: maxId + 1,
            seller: lot.owner ?? 'Биржа',
            buyer: NICK_POOL[Math.floor(Math.random() * NICK_POOL.length)],
            uid: 'live-' + Date.now(),
            price,
            at: new Date().toISOString(),
          });
          refreshHistory();
          return;
        }
        if (act === 'play') {
          const frame = btn.closest('[data-frame]');
          const lot = currentLot();
          if (frame && lot.webm) {
            frame.innerHTML = `<video controls autoplay playsinline preload="metadata" poster="${esc(lot.poster)}" src="${esc(lot.webm)}"></video>`;
          }
          return;
        }
      });

      // Стартовое состояние из адреса.
      (function init() {
        const q = new URLSearchParams(location.search);
        const v = (q.get('variant') || 'A').toUpperCase();
        if (VARIANTS.some((x) => x.key === v)) state.variant = v;
        const l = q.get('lot');
        if (l && LOTS.some((x) => x.slug === l)) state.lot = l;
        const t = q.get('time');
        if (['rel', 'exact', 'both'].includes(t)) state.time = t;
        render();
      })();
    </script>
  </body>
</html>
