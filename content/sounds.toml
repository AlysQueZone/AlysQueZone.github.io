# Звуки гамбы — источник правды. Список пулов: spin | win | jackpot | lose.
# Синк в прод: `just sounds-sync` (миграции не нужны). Локальный сид: `just sounds-gen`.
# Добавить звук: `just sound-add <файл|URL> --pool <пул>` (конвертация, залив,
# строка сюда, синк — одной командой).
#
# file — имя файла в публичном бакете media/sounds (без пути и без URL: его
#   собирает s3Sound() по имени). Правишь список руками — правь только здесь:
#   синк делает таблицу ровно такой, как этот файл, и сносит из неё лишнее.
#   Имена исторические: префикс пула не всегда совпадает (`gamba-super-*` —
#   джекпот, `m4-scum.mp3` — проигрыш). Новые звуки sound-add печёт как
#   `gamba-<пул>-<слаг>`.

