<!DOCTYPE html>
<!-- THROWAWAY PROTOTYPE, wipe me. Not production: no tests, minimal error handling. -->
<!-- Question: фон-картинка или сплошной? F1 «cover + вуаль» vs F2 «blur». -->
<!-- Assumption: схема D1 (CTA #C2187B), поверх арта плотный кремовый оверлей, контраст текста ≥4.5:1 в обоих. -->
<!-- Run: double-click this file. State: in-memory (баланс 1000 Пивкойнов). Image: hotlink, не скачивать. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlysQueZone — Фон: картинка vs blur (PROTOTYPE)</title>
<style>
  body{
    --bg:#FFF6BF; --topbar:#FFE4A6; --surface:#FFEFC0; --surface2:#FFE4A6;
    --ink:#422006; --muted:#744210;
    --cta:#C2187B; --cta-hover:#9E145F; --cta-text:#FFFBEA;
    --accent:#FF00BC; --detail:#92400E; --card-border:#DFA14E;
    --toast-bg:#2A160B; --toast-tx:#FFFBEA;
    --hero-grad:linear-gradient(180deg,#FFE4A6,#FFC9DD);
  }
  *{box-sizing:border-box}
  body{color:var(--ink);font-family:Inter,Manrope,system-ui,sans-serif;margin:0;background:var(--bg)}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
  /* Фоновые слои: картинка + кремовая вуаль поверх. Контент выше обоих. */
  .bg{position:fixed;inset:0;z-index:-2;background:url("https://yt3.googleusercontent.com/HGMxZJDXHz-s9Kw6GSP3zRo_3oyDZwSAjZ5O8m04CMSypa_mpqR1vtfGk7y8tlcv47qlUkeN=s900-c-k-c0x00ffffff-no-rj") center/cover no-repeat}
  .veil{position:fixed;inset:0;z-index:-1}
  body[data-variant="F1"] .bg{filter:none}
  body[data-variant="F1"] .veil{background:rgba(255,246,191,.88)}
  body[data-variant="F2"] .bg{filter:blur(10px) brightness(.92) saturate(.9);transform:scale(1.06)}
  body[data-variant="F2"] .veil{background:rgba(255,246,191,.93)}
  header.top{display:flex;gap:12px;align-items:center;padding:12px 16px;background:var(--topbar);border-bottom:2px solid var(--card-border);position:sticky;top:0;z-index:5}
  header.top .logo{font-weight:900;letter-spacing:.5px}
  header.top .logo .dot{color:var(--accent)}
  #wallet{margin-left:auto;background:var(--ink);color:var(--toast-tx);padding:6px 12px;border-radius:999px}
  main{max-width:1100px;margin:0 auto;padding:20px}
  .hero{padding:28px;border:2px solid var(--card-border);border-radius:16px;background:var(--hero-grad);margin-bottom:18px}
  .hero h1{margin:0 0 8px;font-size:32px;color:var(--ink)}
  .hero h1 .acc{color:var(--cta)}
  .hero p{color:var(--muted)}
  .cta{background:var(--cta);color:var(--cta-text);border:0;padding:10px 18px;border-radius:10px;font-weight:800;cursor:pointer}
  .cta:hover{background:var(--cta-hover)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:12px}
  .card{background:var(--surface);border:2px solid var(--card-border);border-radius:14px;padding:14px}
  .card h3{margin:8px 0;color:var(--ink)}
  .card .owner,.card .hist{color:var(--muted);font-size:13px}
  .price{font-size:20px;font-weight:800;color:var(--detail)}
  .badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
  .rare{background:#9A3412;color:#FFFBEA}
  .common{background:var(--surface2);color:var(--ink)}
  .legendary{background:#B3127A;color:#FFFBEA}
  #toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-tx);padding:10px 18px;border-radius:999px;display:none;z-index:30;max-width:90%}
  #switcher{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#2A160B;color:#FFFBEA;border-radius:999px;padding:6px 10px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 24px rgba(0,0,0,.35);z-index:40;font-weight:800}
  #switcher button{border:0;background:#FFFBEA;color:#2A160B;border-radius:999px;width:32px;height:32px;cursor:pointer;font-size:16px;font-weight:900}
  #state{position:fixed;bottom:14px;right:14px;background:#2A160B;color:#FFFBEA;font-size:11px;padding:6px 10px;border-radius:8px;z-index:40}
</style>
</head>
<body data-variant="F1">
<div class="bg" aria-hidden="true"></div>
<div class="veil" aria-hidden="true"></div>
<header class="top">
  <span class="logo">ALYS<span class="dot">QUE</span>ZONE <span class="mono" style="font-size:11px;color:var(--muted)">PROTOTYPE · ФОН</span></span>
  <span id="wallet" class="mono">🪙 <span id="bal">1000</span> Пивкойнов</span>
</header>
<main>
  <div class="hero">
    <h1>Биржа приветов. <span class="acc">Стрим включился, а ты?</span></h1>
    <p>Фон — арт канала под кремовой вуалью. Карточки и hero непрозрачные, текст #422006 / #744210 на креме.</p>
    <button class="cta" onclick="toast('Поздравляем! Привет твой: тестовый (тост)');document.getElementById('lots').scrollIntoView()">К лотам →</button>
  </div>
  <h2 id="vtitle"></h2>
  <p id="vdesc" style="color:var(--muted)"></p>
  <div id="lots" class="grid"></div>
</main>

<div id="toast" class="mono"></div>
<nav id="switcher" aria-label="prototype switcher">
  <button id="prev" title="prev">←</button>
  <span id="vlabel" class="mono">F1</span>
  <button id="next" title="next">→</button>
</nav>
<div id="state" class="mono"></div>

<script>
const LOTS = [
  {id:"lot-vandal-privet", title:"Привет онлайновсеие чуваки", owner:"VandaLQuE", price:600, rarity:"rare", history:[{from:"aLySQuE",to:"VandaLQuE",price:200}]},
  {id:"lot-gedo-sleepy", title:"Спящий привет от Gedo0", owner:"Gedo0", price:250, rarity:"common", history:[{from:"aLySQuE",to:"Gedo0",price:250}]},
  {id:"lot-andrew-37", title:"Привет от Андрюши №37", owner:"Андрюша №37", price:100, rarity:"common", history:[{from:"aLySQuE",to:"Андрюша №37",price:100}]}
];
const META = {
  F1:{name:"F1 «cover + вуаль»", desc:"Арт на весь фон (cover, center), поверх кремовый оверлей rgba(255,246,191,.88) без блюра. Контент как сейчас, карточки непрозрачные."},
  F2:{name:"F2 «blur»", desc:"Тот же cover, но blur(10px) + приглушение, вуаль плотнее rgba(255,246,191,.93). Текст максимально читаем, настроение фона остается."}
};
const ORDER = ["F1","F2"];
function toast(t){ const e=document.getElementById("toast"); e.textContent=t; e.style.display="block"; setTimeout(()=>e.style.display="none",2600); }
function renderState(){ document.getElementById("state").textContent = "variant=" + cur() + " lots=" + LOTS.length; }
function renderLots(){
  const g = document.getElementById("lots"); g.innerHTML = "";
  LOTS.forEach((l)=>{
    const d = document.createElement("div"); d.className = "card";
    d.innerHTML = '<span class="badge '+l.rarity+'">'+l.rarity+'</span><h3>'+l.title+'</h3>'
      + '<div class="owner mono">владелец: '+l.owner+'</div>'
      + '<div class="price mono">'+l.price+' 🪙</div>'
      + '<div class="hist mono">'+l.history.map(h=>h.from+" → "+h.to+" ("+h.price+")").join(" · ")+'</div>'
      + '<div style="margin-top:8px"><button class="cta">Купить привет</button></div>';
    d.querySelector("button").onclick = ()=>toast("Поздравляем! Привет твой: " + l.title);
    g.appendChild(d);
  });
}
function cur(){ return new URLSearchParams(location.search).get("variant") ?? "F1"; }
function show(v){
  document.body.dataset.variant = v;
  document.getElementById("vtitle").textContent = META[v].name;
  document.getElementById("vdesc").textContent = META[v].desc;
  document.getElementById("vlabel").textContent = v + " (" + META[v].name + ")";
  const u = new URL(location.href); u.searchParams.set("variant", v); history.replaceState(null,"",u);
  renderState();
}
function step(d){ const i = ORDER.indexOf(cur()); show(ORDER[(i+d+ORDER.length)%ORDER.length]); }
document.getElementById("prev").onclick = ()=>step(-1);
document.getElementById("next").onclick = ()=>step(1);
document.addEventListener("keydown", (e)=>{
  if(/INPUT|TEXTAREA/.test(document.activeElement?.tagName||"") || document.activeElement?.isContentEditable) return;
  if(e.key==="ArrowLeft") step(-1); if(e.key==="ArrowRight") step(1);
});
renderLots();
show(ORDER.includes(cur()) ? cur() : "F1");
</script>
</body>
</html>
